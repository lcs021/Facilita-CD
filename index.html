<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inventário CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra superior escura, conteúdo em coluna de 680px, navegação inferior com botão central de registrar */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunken:#eef1f6; --line:#e3e7ee; --line2:#d3d9e3;
  --fg:#111827; --muted:#667085; --ink:#0e1525; --ink-fg:#f5f7fb;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --gar:#e2621b; --gar-soft:#fdeee4; --gar-ink:#9a3b07;
  --min:#15803d; --min-soft:#e3f6e9; --min-ink:#14532d;
  --alta:#d43d30; --baixa:#1f8a4c;
  --sh1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sh2:0 4px 16px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);
  --r:14px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c111b; --surface:#151c29; --sunken:#1c2534; --line:#253045; --line2:#334058;
  --fg:#e9edf5; --muted:#94a0b4; --ink:#070b13; --ink-fg:#f5f7fb;
  --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1a2747;
  --gar:#ff8a45; --gar-soft:#3a2216; --gar-ink:#ffc39d;
  --min:#4ade80; --min-soft:#13301f; --min-ink:#a7f3c0;
  --alta:#ff6b5e; --baixa:#4cc785;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* Topo */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--ink-fg);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:680px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff8a45,#e2621b);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(226,98,27,.35)}
.logo svg{width:20px;height:20px;color:#fff}
h1{font-size:1.08rem;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.hdr{display:flex;align-items:center;gap:10px;min-width:0}
.who{font-size:.82rem;color:#b8c2d6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
#sair{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--ink-fg);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.84rem;cursor:pointer}
#sair:hover{background:rgba(255,255,255,.16)}
body.auth .topbar{display:none}

.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
h2{font-size:1.3rem;margin:0 0 4px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
h3{font-size:1rem;margin:0}
.muted{color:var(--muted)} .small{font-size:.84rem}
.mono{font-family:var(--mono)}
.lbl{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Navegação inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));max-width:100%}
nav button{background:none;border:0;color:var(--muted);font:600 .74rem var(--font);padding:6px 2px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button svg{width:23px;height:23px}
nav button[aria-current="true"]{color:var(--accent)}
nav button[aria-current="true"] .ic{background:var(--accent-soft)}
nav .ic{display:grid;place-items:center;width:46px;height:30px;border-radius:999px;transition:background .15s}
nav button[data-tab="nova"] .ic{width:48px;height:48px;margin-top:-22px;background:linear-gradient(135deg,#ff8a45,#e2621b);color:#fff;border-radius:16px;box-shadow:0 6px 16px rgba(226,98,27,.38)}
nav button[data-tab="nova"][aria-current="true"] .ic{background:linear-gradient(135deg,#ff8a45,#e2621b);outline:3px solid var(--gar-soft)}
nav button[data-tab="nova"]{color:var(--fg)}
nav .badge{position:absolute;top:0;left:calc(50% + 8px);background:var(--alta);color:#fff;border-radius:999px;font-size:.66rem;font-weight:800;padding:1px 6px;border:2px solid var(--surface)}

/* Formulários */
input,select,textarea{font-size:.97rem;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#9aa4b5}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:700 .97rem var(--font);border-radius:12px;padding:12px 18px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;transition:transform .05s,box-shadow .15s,background .15s}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{font-size:.84rem;padding:8px 13px;border-radius:10px}
.btn.danger{color:var(--alta)}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 4px;font-size:.92rem;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.stack{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh1)}
.center{max-width:440px;margin:12px auto 0}
.err{color:var(--alta);font-size:.88rem;font-weight:600;background:color-mix(in srgb,var(--alta) 9%,transparent);padding:9px 12px;border-radius:10px}
.ok{color:var(--baixa);font-size:.88rem;font-weight:600;background:color-mix(in srgb,var(--baixa) 10%,transparent);padding:9px 12px;border-radius:10px}

/* Telas de acesso */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin:36px auto 22px}
.hero .logo{width:62px;height:62px;border-radius:18px}
.hero .logo svg{width:34px;height:34px}
.hero h1{font-size:1.6rem;white-space:normal}
.hero p{margin:0;color:var(--muted)}
body.auth{background:radial-gradient(1200px 500px at 50% -10%,var(--gar-soft),transparent 70%),var(--bg)}

/* Lista */
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters>*{flex:1 1 160px;min-width:0}
.seg{display:flex;gap:4px;background:var(--sunken);border-radius:13px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;font:700 .92rem var(--font);color:var(--muted);cursor:pointer;border-radius:10px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--sh1)}
.seg button[data-cat="Garantia"][aria-pressed="true"]{color:var(--gar)}
.seg button[data-cat="Relatório"][aria-pressed="true"]{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:10px;width:100%;box-shadow:var(--sh1);transition:box-shadow .15s,transform .1s,border-color .15s}
.card:hover{box-shadow:var(--sh2);border-color:var(--line2)}
.card:active{transform:scale(.995)}
.thumb{background:var(--sunken);position:relative;min-height:76px;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.68rem;font-weight:600;text-align:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .b{min-width:0;display:flex;flex-direction:column;gap:3px;padding-block:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-weight:800;letter-spacing:-.01em}
.line{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{font-family:var(--mono);font-size:.78rem;background:var(--sunken);padding:1px 6px;border-radius:5px}
.empty{text-align:center;color:var(--muted);padding:44px 16px;border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--surface)}

/* Registrar */
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:.92rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.radios label:hover{border-color:var(--line2)}
.radios input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none;box-shadow:none}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;border:1.5px dashed var(--line2);border-radius:12px;background:var(--surface);padding:16px 8px;font-weight:700;font-size:.94rem;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.addbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.addbtn svg{width:22px;height:22px;flex:none;color:var(--accent)}
.addbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.addbtn.off{color:var(--muted);cursor:default;font-weight:600}
.addbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--sunken);max-width:100%;display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.ph button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;z-index:2;font-size:1rem}
.vb{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.65);color:#fff;font-size:.66rem;padding:1px 6px;border-radius:5px;z-index:2}
.catpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catpick button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px 13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;font:inherit;box-shadow:var(--sh1);transition:border-color .15s,background .15s}
.catpick button:hover{border-color:var(--line2)}
.catpick button b{font-size:1.02rem;font-weight:800}
.catpick button small{font-size:.78rem;color:var(--muted);line-height:1.35}
.catpick button.gar[aria-pressed="true"]{border-color:var(--gar);background:var(--gar-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--gar) 15%,transparent)}
.catpick button.gar[aria-pressed="true"] b{color:var(--gar)}
.catpick button.rel[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.catpick button.rel[aria-pressed="true"] b{color:var(--accent)}
.catpick.g4o{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.catpick.g4o{grid-template-columns:1fr 1fr}}
.gbox{border-color:color-mix(in srgb,var(--gar) 35%,var(--line));background:linear-gradient(180deg,var(--gar-soft),var(--surface) 60%)}

/* Detalhe */
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery img{height:230px;max-width:85%;border-radius:14px;object-fit:cover;flex:none;background:var(--sunken);scroll-snap-align:start}
.vplay{width:100%;max-height:380px;border-radius:14px;background:#000}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;margin:0}
dl.facts dt{color:var(--muted);font-size:.86rem}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:600}
ul.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.hist li{font-size:.9rem;border-left:2px solid var(--line2);padding-left:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap} .actions .btn{flex:1 1 auto}

/* Resumo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.85}
.stats.g4 .stat:first-child::before{background:#e0a100}
.stats.g4 .stat:last-child::before{background:var(--gar)}
.stat .v{font:800 1.75rem var(--mono);letter-spacing:-.02em;line-height:1.15}
.stats.g4{grid-template-columns:repeat(2,1fr)}
.bar{display:grid;grid-template-columns:minmax(0,10rem) 1fr 2.2rem;gap:12px;align-items:center;font-size:.88rem;font-weight:600}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--sunken);border-radius:999px;overflow:hidden}
.bar .f{height:100%;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff));border-radius:999px}
.bar .v{text-align:right;font-family:var(--mono);font-weight:700}
.stack>.datas{flex:none!important}
.mesrow{display:grid;grid-template-columns:minmax(0,8rem) minmax(0,12rem);gap:10px}
.mchart .vl.mini{font-size:9px}
.mesnum{display:flex;gap:22px;flex-wrap:wrap;font-size:.95rem;align-items:flex-end}
.mesnum b{font-size:1.6rem;font-family:var(--mono);font-weight:800;margin-right:3px}
.chartwrap{overflow-x:auto}
.mchart{width:100%;height:auto;display:block}
.mchart .gl{stroke:var(--line);stroke-width:1}
.mchart .ax{fill:var(--muted);font-size:12px;font-family:var(--font);font-weight:600}
.mchart .ax.on{fill:var(--fg);font-weight:800}
.mchart .vl{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--mono)}
.mchart .bg{fill:var(--gar)} .mchart .br{fill:var(--accent)}
.mchart .hit{fill:transparent} .mchart .sel{fill:var(--sunken)}
.mchart .mg{cursor:pointer;outline:none} .mchart .mg:focus-visible .hit{stroke:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;align-items:center;font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.dot.bg{background:var(--gar)} .dot.br{background:var(--accent)}

/* Equipe */
.person{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.person:first-child{padding-top:0}
.person:last-child{border-bottom:0;padding-bottom:0}
.person .info{min-width:0}
.ctl{display:flex;flex-direction:column;gap:6px;flex:none;width:13rem}
.ctl select{padding:8px 10px;font-size:.88rem}
.ctl2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctl2 .btn{padding:8px 6px}
.nao{color:var(--alta);font-weight:700}
details summary{cursor:pointer;list-style-position:inside}
.pill{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.new{background:var(--alta);color:#fff}

/* Etiquetas */
.cat{font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block;letter-spacing:.02em}
.cat.gar{background:var(--gar-soft);color:var(--gar-ink)}
.cat.rel{background:var(--accent-soft);color:var(--accent)}
.cat.min{background:var(--min-soft);color:var(--min-ink)}
.catpick.c3{grid-template-columns:repeat(3,1fr)}
@media (max-width:520px){.catpick.c3 small{display:none}.catpick.c3 button{padding:12px 8px;text-align:center}}
.catpick button.min[aria-pressed="true"]{border-color:var(--min);background:var(--min-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--min) 15%,transparent)}
.catpick button.min[aria-pressed="true"] b{color:var(--min)}
.seg button[data-cat="Minucioso"][aria-pressed="true"]{color:var(--min)}
.submenu{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:thin;scroll-snap-type:x proximity}
.subtab{flex:none;scroll-snap-align:start;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 14px;font:700 .86rem var(--font);cursor:pointer;white-space:nowrap;transition:all .15s}
.subtab:hover{border-color:var(--line2)}
.subtab .sc{font:700 .72rem var(--mono);background:var(--sunken);color:var(--muted);border-radius:999px;padding:1px 7px}
.subtab[aria-pressed="true"]{background:var(--min);border-color:var(--min);color:#fff}
.subtab[aria-pressed="true"] .sc{background:rgba(255,255,255,.25);color:#fff}
.sethead{display:flex;flex-direction:column;gap:12px;border-color:color-mix(in srgb,var(--min) 35%,var(--line));background:linear-gradient(180deg,var(--min-soft),var(--surface) 70%)}
.sethead .row{align-items:flex-start}
.sethead b{font-size:1.05rem}
.setnums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.setnums div{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.setnums b{font:800 1.2rem var(--mono)}
.setnums span{font-size:.72rem;color:var(--muted);font-weight:600}
@media (max-width:420px){.setnums{grid-template-columns:repeat(2,1fr)}}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.setcard{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;font:inherit;box-shadow:var(--sh1);transition:border-color .15s,background .15s;min-width:0}
.setcard:hover{border-color:var(--line2)}
.setcard b{font-size:.95rem;font-weight:800}
.setcard .ch{font-size:.76rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.setcard .nm{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.setcard[aria-pressed="true"]{border-color:var(--min);background:var(--min-soft)}
.setcard[aria-pressed="true"] b{color:var(--min)}
.setcard.todos{justify-content:center;align-items:center;text-align:center}
.dif{font-family:var(--mono);font-weight:800}
.dif.pos{color:#c27803}.dif.neg{color:var(--alta)}.dif.zero{color:var(--min)}
.mbox{border-color:color-mix(in srgb,var(--min) 35%,var(--line));background:linear-gradient(180deg,var(--min-soft),var(--surface) 60%)}
.mchart .bm{fill:var(--min)} .dot.bm{background:var(--min)}
.chefrow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.chefrow:last-child{border-bottom:0}
.chefrow b{font-size:.9rem}
@media (max-width:420px){.chefrow{grid-template-columns:1fr auto}.chefrow b{grid-column:1/-1}}
.gst{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;white-space:nowrap}

<script type="text/plain" id="sql">-- Inventário CD: estrutura do banco (rode uma vez no SQL Editor do Supabase)

-- Tabelas
create table if not exists public.perfis (
  id uuid primary key references auth.users(id) on delete cascade,
  nome text not null default '',
  email text,
  cargo text not null default 'Conferente',
  aprovado boolean not null default false,
  admin boolean not null default false,
  criado timestamptz not null default now()
);
alter table public.perfis add column if not exists recusado boolean not null default false;

create table if not exists public.ocorrencias (
  id uuid primary key default gen_random_uuid(),
  tipo text not null,
  endereco text not null,
  sku text,
  produto text,
  fab text,
  qtd integer,
  obs text,
  fotos text[] not null default '{}',
  videos text[] not null default '{}',
  autor uuid references public.perfis(id) on delete set null,
  status text not null default 'aberta',
  hist jsonb not null default '[]'::jsonb,
  criado timestamptz not null default now()
);

-- Categoria do registro (Garantia ou Relatório)
alter table public.ocorrencias add column if not exists categoria text not null default 'Relatório';
alter table public.ocorrencias add column if not exists fornecedor text;
alter table public.ocorrencias add column if not exists id_quebra text;
alter table public.ocorrencias add column if not exists gar_status text;
alter table public.ocorrencias add column if not exists origem text;

alter table public.perfis enable row level security;
alter table public.ocorrencias enable row level security;

-- Funções de permissão
create or replace function public.is_aprovado() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select aprovado or admin from public.perfis where id = auth.uid()), false)
$$;

create or replace function public.is_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select admin from public.perfis where id = auth.uid()), false)
$$;

create or replace function public.tem_cargo(cargos text[]) returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select admin or (aprovado and cargo = any(cargos)) from public.perfis where id = auth.uid()), false)
$$;

-- Ao criar uma conta, cria o perfil. A primeira conta vira administrador.
create or replace function public.novo_usuario() returns trigger
language plpgsql security definer set search_path = public as $$
declare primeiro boolean;
begin
  select not exists (select 1 from public.perfis) into primeiro;
  insert into public.perfis (id, nome, email, cargo, aprovado, admin)
  values (new.id, coalesce(new.raw_user_meta_data->>'nome', ''), new.email,
          case when primeiro then 'Supervisor' else 'Conferente' end, primeiro, primeiro);
  return new;
end
$$;

drop trigger if exists ao_criar_usuario on auth.users;
create trigger ao_criar_usuario after insert on auth.users
  for each row execute function public.novo_usuario();

-- Regras de acesso: perfis
drop policy if exists "ver perfis" on public.perfis;
create policy "ver perfis" on public.perfis for select to authenticated
  using (id = auth.uid() or public.is_aprovado());
drop policy if exists "admin altera perfis" on public.perfis;
create policy "admin altera perfis" on public.perfis for update to authenticated
  using (public.is_admin()) with check (public.is_admin());

-- Regras de acesso: ocorrências
drop policy if exists "ver ocorrencias" on public.ocorrencias;
create policy "ver ocorrencias" on public.ocorrencias for select to authenticated
  using (public.is_aprovado());
drop policy if exists "registrar ocorrencias" on public.ocorrencias;
create policy "registrar ocorrencias" on public.ocorrencias for insert to authenticated
  with check (public.is_aprovado() and autor = auth.uid());
drop policy if exists "tratar ocorrencias" on public.ocorrencias;
create policy "tratar ocorrencias" on public.ocorrencias for update to authenticated
  using (public.tem_cargo(array['Líder','Analista de inventário','Supervisor']))
  with check (public.tem_cargo(array['Líder','Analista de inventário','Supervisor']));
drop policy if exists "apagar ocorrencias" on public.ocorrencias;
create policy "apagar ocorrencias" on public.ocorrencias for delete to authenticated
  using (public.tem_cargo(array['Supervisor']));

-- Fotos e vídeos (pasta privada, até 50 MB por arquivo)
insert into storage.buckets (id, name, public, file_size_limit)
values ('midias', 'midias', false, 52428800)
on conflict (id) do nothing;

drop policy if exists "ver midias" on storage.objects;
create policy "ver midias" on storage.objects for select to authenticated
  using (bucket_id = 'midias' and public.is_aprovado());
drop policy if exists "enviar midias" on storage.objects;
create policy "enviar midias" on storage.objects for insert to authenticated
  with check (bucket_id = 'midias' and public.is_aprovado());
drop policy if exists "apagar midias" on storage.objects;
create policy "apagar midias" on storage.objects for delete to authenticated
  using (bucket_id = 'midias' and (owner_id = auth.uid()::text or public.tem_cargo(array['Supervisor'])));

-- Excluir usuário não liberado (somente administrador)
create or replace function public.excluir_usuario(alvo uuid) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not public.is_admin() then raise exception 'Apenas o administrador pode excluir usuários'; end if;
  if alvo = auth.uid() then raise exception 'Você não pode excluir a si mesmo'; end if;
  if exists (select 1 from public.perfis where id = alvo and (admin or aprovado)) then
    raise exception 'Só é possível excluir usuários não liberados';
  end if;
  delete from auth.users where id = alvo;
end
$$;
revoke all on function public.excluir_usuario(uuid) from public, anon;
grant execute on function public.excluir_usuario(uuid) to authenticated;

-- Minucioso: setores e contagem
alter table public.ocorrencias add column if not exists setor text;
alter table public.ocorrencias add column if not exists chefe text;
alter table public.ocorrencias add column if not exists qtd_sistema integer;
alter table public.ocorrencias add column if not exists qtd_contada integer;

create table if not exists public.setores (
  nome text primary key,
  chefe text,
  ordem integer not null default 0
);
alter table public.setores enable row level security;
drop policy if exists "ver setores" on public.setores;
create policy "ver setores" on public.setores for select to authenticated using (public.is_aprovado());
drop policy if exists "admin edita setores" on public.setores;
create policy "admin edita setores" on public.setores for all to authenticated using (public.is_admin()) with check (public.is_admin());

insert into public.setores (nome, ordem) values
  ('Expedição',0),('Shopee',1),('Mercado Livre',2),('Cofre',3),('1º andar',4),
  ('2º andar',5),('3º andar',6),('Carga e descarga',7),('Recebimento',8),('Parachoque',9)
on conflict (nome) do nothing;

-- Minucioso: ficha de falta de produtos
alter table public.ocorrencias add column if not exists custo numeric;
alter table public.ocorrencias add column if not exists falta numeric;
alter table public.ocorrencias add column if not exists motivo_chefe text;
alter table public.ocorrencias add column if not exists motivo_inventario text;
alter table public.ocorrencias add column if not exists motivo_allan text;
</script>

<script>
/* ===== CONFIGURAÇÃO (preenchida pela tela de configuração) ===== */
const SUPABASE_URL='';const SUPABASE_KEY='';
/* =============================================================== */

const ORIGINAL='<!doctype html>\n'+document.documentElement.outerHTML;
const TIPOS_CAT={'Garantia':['Peça quebrada','Peça com defeito','Embalagem violada','Kit incompleto'],'Relatório':['Avaria / peça quebrada','Embalagem violada','Sem etiqueta / ilegível','Código divergente (peça trocada)','Kit incompleto']};
const ORIGENS={'Loja':'Retirado como quebrado na loja','Fábrica':'Veio quebrado ou com defeito do fabricante','Transporte':'Quebrou no frete ou na entrega','CD':'Quebrou dentro do CD'};
const TIPOS=[...new Set([...TIPOS_CAT['Garantia'],...TIPOS_CAT['Relatório']])];
const CARGOS={'Conferente':['registrar'],'Operador':['registrar'],'Líder':['registrar','resumo','garantia'],'Analista de inventário':['registrar','resumo','garantia'],'Supervisor':['registrar','resumo','garantia','apagar']};
const CARGO_DESC={'Conferente':'registra','Operador':'registra','Líder':'registra, vê o resumo e atualiza garantias','Analista de inventário':'registra, vê o resumo e atualiza garantias','Supervisor':'tudo, inclusive apagar registros'};
const ANDARES={'11':'1º andar','12':'2º andar','13':'3º andar'},LETRAS='ABCDEFGHI'.split('');
const BUCKET='midias',H=3600e3,MAX_VIDEO=50*1024*1024;

let sb=null,uid=null,eu=null,perfis={},ocs=[],carregou=false;
let tela='login',msgLogin='';
let ui={tab:'lista',setor:'',mes:'',fano:'',fmes:'',cat:'Garantia',gst:'',busca:'',tipo:'',pessoa:'',de:'',ate:'',det:null,confDel:false};
let draft=null,saving=false,enviando=0;
const urls={},pedindo=new Set();

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ts=t=>new Date(t).getTime();
const fData=t=>{const d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const idade=t=>{const h=Math.floor((Date.now()-ts(t))/H);return h<1?'agora':h<24?h+'h':Math.floor(h/24)+'d'};
const nome=id=>perfis[id]?.nome||'Alguém';
const pode=a=>!!eu&&(eu.admin||(CARGOS[cargoNome(eu.cargo)]||[]).includes(a));
const andarDe=e=>{const m=String(e||'').match(/^(1[123])/);return m?m[1]:''};
let tt;function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3200)}
function erroMsg(e){const m=(e&&(e.message||e.error_description))||'';
  if(/categoria|fornecedor|id_quebra|gar_status|origem|recusado|setor|chefe|qtd_sistema|qtd_contada|custo|falta|motivo/i.test(m))return'O banco precisa de uma atualização (coluna categoria). Peça ao administrador para rodar o comando de atualização no SQL Editor do Supabase.';
  if(/Invalid login credentials/i.test(m))return'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return'Confirme seu e-mail antes de entrar. Veja a mensagem que chegou na sua caixa de entrada.';
  if(/already registered|already been registered/i.test(m))return'Este e-mail já tem cadastro. Use a tela Entrar.';
  if(/Password should be/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';
  if(/row-level security|permission|not authorized|violates/i.test(m))return'Sem permissão para isso. Fale com o administrador.';
  if(/Failed to fetch|NetworkError|network/i.test(m))return'Sem conexão com o servidor. Verifique a internet.';
  if(/exceeded the maximum allowed size|Payload too large/i.test(m))return'Arquivo grande demais.';
  return m?'Erro: '+m:'Algo deu errado. Tente de novo.'}

/* ---------- Início ---------- */
async function init(){
  const CFG=window.INV_CONFIG||{},URL_=SUPABASE_URL||CFG.url,KEY_=SUPABASE_KEY||CFG.key;
  if(!URL_||!KEY_){telaConfig();return}
  if(!window.supabase){$('view').innerHTML='<div class="center box stack"><h2>Sem conexão</h2><p>Não foi possível carregar o app. Verifique se este computador tem acesso à internet e abra o arquivo de novo.</p></div>';return}
  sb=window.supabase.createClient(URL_,KEY_);
  sb.auth.onAuthStateChange((ev,s)=>{const novo=s?.user?.id||null;if(novo!==uid){uid=novo;setTimeout(entrouOuSaiu,0)}});
  const {data}=await sb.auth.getSession();uid=data.session?.user?.id||null;entrouOuSaiu();
  setInterval(()=>{if(eu&&(eu.aprovado||eu.admin)&&!document.hidden&&!ui.det&&ui.tab!=='nova')carregar()},30000);
}
async function entrouOuSaiu(){
  if(!uid){eu=null;perfis={};ocs=[];carregou=false;render();return}
  await carregarPerfil();await carregar();
}
async function carregarPerfil(){
  const {data,error}=await sb.from('perfis').select('*').eq('id',uid).maybeSingle();
  if(error){toast(erroMsg(error))}eu=data||null;
}
async function carregar(){
  if(!uid)return;await carregarPerfil();
  if(eu&&(eu.aprovado||eu.admin)){
    const [p,o]=await Promise.all([sb.from('perfis').select('*').order('criado',{ascending:false}),sb.from('ocorrencias').select('*').order('criado',{ascending:false}).limit(500)]);
    if(p.data){perfis={};p.data.forEach(x=>perfis[x.id]=x)}
    if(o.data)ocs=o.data.map(x=>x.gar_status==='Enviado ao fornecedor'?{...x,gar_status:'Enviado à garantia da loja'}:x);
    if(o.error)toast(erroMsg(o.error));
    const st=await sb.from('setores').select('*');if(st.data){chefes={};st.data.forEach(x=>chefes[x.nome]=x.chefe||'')}
  }
  carregou=true;render();
}
$('sair').addEventListener('click',async()=>{await sb.auth.signOut();tela='login';msgLogin='';draft=null;ui={...ui,tab:'lista',det:null}});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function go(tab){ui={...ui,tab,det:null,confDel:false};if(tab==='nova'&&!draft)draft=novo();render();scrollTo(0,0);if(tab!=='nova')carregar()}
const CATS={'Garantia':'Peça quebrada ou com defeito para acionar a garantia do fornecedor','Relatório':'Registro de fato do inventário, sem garantia','Minucioso':'Contagem detalhada por setor, sistema x físico'};
const SETORES=['Expedição','Shopee','Mercado Livre','Cofre','1º andar','2º andar','3º andar','Carga e descarga','Recebimento','Parachoque'];
let chefes={};
const chefeDe=s=>chefes[s]||'';
const difDe=o=>(o.qtd_sistema==null||o.qtd_contada==null)?null:o.qtd_contada-o.qtd_sistema;
const brl=v=>v==null||v===''||isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const totalMin=o=>(o.custo!=null&&o.falta!=null)?Number(o.custo)*Number(o.falta):null;
const difHTML=v=>v==null?'—':`<span class="dif ${v>0?'pos':v<0?'neg':'zero'}">${v>0?'+':''}${v}</span>`;
const GST=['Pendente','Enviado à garantia da loja'];
const gstCls=s=>({'Pendente':'p','Enviado à garantia da loja':'e','Crédito recebido':'c','Recusada':'r'})[s]||'p';
const gstBadge=o=>o.categoria==='Garantia'?`<span class="gst ${gstCls(o.gar_status)}">${esc(o.gar_status||'Pendente')}</span>`:'';
const cargoNome=c=>c;
const catCls=c=>c==='Garantia'?'gar':c==='Minucioso'?'min':'rel';
const catBadge=c=>`<span class="cat ${catCls(c||'Relatório')}">${esc(c||'Relatório')}</span>`;
function novo(){return{cat:ui.cat==='Minucioso'?'Minucioso':'',setor:'',qs:'',qc:'',chefe:'',custo:'',falta:'',motivo_inventario:'',motivo_chefe:'',motivo_allan:'',origem:'',forn:'',idq:'',tipo:'',end:'',andar:'',letra:'',sku:'',produto:'',fab:'',qtd:'',obs:'',fotos:[],videos:[]}}

function render(){
  const v=$('view'),fora=()=>{$('nav').hidden=true;$('sair').hidden=!uid;$('who').textContent=''};
  if(!sb)return;
  document.body.classList.toggle('auth',!uid);
  if(!uid){fora();if(tela==='cadastro'){v.innerHTML=cadastroHTML();bindCadastro()}else{v.innerHTML=loginHTML();bindLogin()}return}
  if(!carregou){fora();v.innerHTML='<div class="center box"><p class="muted">Carregando…</p></div>';return}
  if(!eu){fora();v.innerHTML='<div class="center box stack"><h2>Perfil não encontrado</h2><p>Sua conta existe, mas o perfil não foi criado. Peça ao administrador para conferir a configuração do banco (passo do SQL).</p></div>';return}

  $('nav').hidden=false;$('sair').hidden=false;$('who').textContent=eu.nome+' · '+cargoNome(eu.cargo);
  const pend=Object.values(perfis).filter(p=>!p.aprovado&&!p.admin&&!p.recusado).length;

  $('nav').style.gridTemplateColumns=`repeat(${document.querySelectorAll('nav button:not([hidden])').length},1fr)`;
  if((ui.tab==='resumo'&&!pode('resumo'))||(ui.tab==='equipe'&&!eu.admin))ui.tab='lista';
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===ui.tab&&!ui.det)));
  if(ui.det){const od=ocs.find(x=>x.id===ui.det);if(od&&od.categoria==='Minucioso'&&!(od.qtd_contada!=null&&od.falta==null)){v.innerHTML=minDetHTML(od);bindMinDet(od)}else{v.innerHTML=detHTML();bindDet()}}
  else if(ui.tab==='lista'){v.innerHTML=listaHTML();bindLista()}
  else if(ui.tab==='nova'){if(draft.cat==='Minucioso'){v.innerHTML=minFormHTML();bindMinForm()}else{v.innerHTML=formHTML();bindForm()}}
  else if(ui.tab==='resumo'){v.innerHTML=resumoHTML();bindCards();bindResumo()}
  else{v.innerHTML=equipeHTML();bindEquipe()}
  pedirUrls();
}

function src(path){return urls[path]?.url||''}
function pedirUrls(){
  const falta=[...document.querySelectorAll('[data-path]')].map(e=>e.dataset.path).filter(p=>p&&!(urls[p]&&urls[p].ate>Date.now())&&!pedindo.has(p));
  [...document.querySelectorAll('[data-path]')].forEach(e=>{if(urls[e.dataset.path])e.src=urls[e.dataset.path].url});
  if(!falta.length)return;falta.forEach(p=>pedindo.add(p));
  sb.storage.from(BUCKET).createSignedUrls(falta,3600).then(({data})=>{(data||[]).forEach(d=>{if(d.signedUrl)urls[d.path]={url:d.signedUrl,ate:Date.now()+50*60e3}});
    falta.forEach(p=>pedindo.delete(p));document.querySelectorAll('[data-path]').forEach(e=>{if(urls[e.dataset.path]&&!e.src)e.src=urls[e.dataset.path].url})});
}

/* ---------- Exportar Excel ---------- */
function carregarXlsx(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportarExcel(lista){
  const b=$('exportar');if(b){b.disabled=true;b.textContent='Gerando…'}
  try{await carregarXlsx()}catch(e){toast('Não foi possível carregar o gerador de Excel. Verifique a internet.');if(b){b.disabled=false;b.textContent='⬇ Exportar Excel'}return}
  const enviadoEm=o=>{const h=[...(o.hist||[])].reverse().find(x=>/^Enviado (ao fornecedor|à garantia)/.test(x.txt||''));return h?fData(h.t):''};
  const linhas=lista.map(o=>{const d=new Date(o.criado);return{
    'Data':d.toLocaleDateString('pt-BR'),'Hora':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    'Categoria':o.categoria||'Relatório','Tipo':o.tipo||'','Origem da quebra':o.origem||'',
    'Situação da garantia':o.categoria==='Garantia'?(o.gar_status||'Pendente'):'','Enviado à garantia em':o.categoria==='Garantia'?enviadoEm(o):'',
    'Setor':o.setor||'','Chefe do setor':o.chefe||'','Custo':o.custo??'','Falta':o.falta??'','Total':totalMin(o)??'','Motivo chefe setor':o.motivo_chefe||'','Motivo inventário':o.motivo_inventario||'','Motivo Allan':o.motivo_allan||'',
    'Fornecedor':o.fornecedor||'','ID da quebra':o.id_quebra||'','Código da peça':o.sku||'','Peça':o.produto||'','Fabricante':o.fab||'',
    'Quantidade':o.qtd??'','Observação':o.obs||'','Registrado por':nome(o.autor),'Fotos':(o.fotos||[]).length,'Vídeos':(o.videos||[]).length}});
  const ws=XLSX.utils.json_to_sheet(linhas);
  const cols=Object.keys(linhas[0]||{Data:''});ws['!cols']=cols.map(c=>({wch:Math.min(45,Math.max(c.length+2,...linhas.map(r=>String(r[c]??'').length+2)))}));
  if(linhas.length)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:linhas.length,c:cols.length-1}})};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,ui.cat==='Garantia'?'Garantias':ui.cat==='Minucioso'?'Minucioso':'Relatórios');
  const partes=['inventario',ui.cat==='Garantia'?'garantias':ui.cat==='Minucioso'?'minucioso':'relatorios'];if(ui.cat==='Minucioso'&&ui.setor)partes.push(ui.setor.toLowerCase().replace(/[^a-z0-9]+/gi,'-'));if(ui.gst)partes.push(ui.gst.split(' ')[0].toLowerCase());
  if(ui.pessoa)partes.push(nome(ui.pessoa).split(' ')[0].toLowerCase());partes.push(ui.de||ui.ate?(ui.de||'inicio')+'_a_'+(ui.ate||hoje()):hoje());
  XLSX.writeFile(wb,partes.join('-').normalize('NFD').replace(/[\u0300-\u036f]/g,'')+'.xlsx');
  toast(lista.length+(lista.length===1?' linha exportada':' linhas exportadas'));if(b){b.disabled=false;b.textContent='⬇ Exportar Excel'}}

const icCam='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7h4l2-3h6l2 3h4v13H3z"/><circle cx="12" cy="13" r="4"/></svg>';
const icVid='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>';
function formHTML(){const d=draft;return`<form class="stack" id="fnova" novalidate>
  <h2>Novo registro</h2>
  <div class="field"><span class="lbl">Categoria *</span><div class="catpick c3">${Object.entries(CATS).map(([k,dsc])=>`<button type="button" class="${catCls(k)}" data-ncat="${k}" aria-pressed="${d.cat===k}"><b>${k}</b><small>${dsc}</small></button>`).join('')}</div></div>

  ${d.cat==='Minucioso'?`<div class="field"><span class="lbl">Setor *</span><div class="setgrid">${SETORES.map(s=>`<button type="button" class="setcard" data-nset="${esc(s)}" aria-pressed="${d.setor===s}"><b>${esc(s)}</b><span class="ch">${chefeDe(s)?'Chefe: '+esc(chefeDe(s)):'Sem chefe definido'}</span></button>`).join('')}</div></div>`:''}
  <div class="field" ${d.cat==='Minucioso'?'hidden':''}><span class="lbl">Tipo *</span>${d.cat?'':'<span class="muted small">Escolha primeiro Garantia ou Relatório.</span>'}<div class="radios">${(TIPOS_CAT[d.cat]||[]).map((t,i)=>`<label><input type="radio" name="tipo" id="tp${i}" value="${t}" ${d.tipo===t?'checked':''}>${t}</label>`).join('')}</div></div>
  <div class="${d.cat==='Minucioso'?'stack':'two'}"><div class="field"><label class="lbl" for="sku">Código da peça</label><input id="sku" autocapitalize="characters" value="${esc(d.sku)}"></div>
  <div class="field" ${d.cat==='Minucioso'?'hidden':''}><label class="lbl" for="qtd">Quantidade</label><input id="qtd" type="number" min="0" inputmode="numeric" value="${esc(d.qtd)}"></div></div>
  ${d.cat==='Minucioso'?`<div class="box stack mbox"><b class="small">Contagem</b><div class="two"><div class="field"><label class="lbl" for="qs">Qtd no sistema</label><input id="qs" type="number" inputmode="numeric" value="${esc(d.qs)}"></div>
  <div class="field"><label class="lbl" for="qc">Qtd contada</label><input id="qc" type="number" min="0" inputmode="numeric" value="${esc(d.qc)}"></div></div>
  <div class="small">Diferença: <span id="difview">${difHTML(d.qs!==''&&d.qc!==''?(+d.qc)-(+d.qs):null)}</span></div></div>`:''}
  <div class="field"><label class="lbl" for="produto">Peça</label><input id="produto" value="${esc(d.produto)}" placeholder="Ex.: Amortecedor traseiro"></div>
  ${d.cat==='Garantia'?`<div class="box stack gbox"><b class="small">Dados da garantia</b>
  <div class="two"><div class="field"><label class="lbl" for="forn">Fornecedor</label><input id="forn" list="fornList" value="${esc(d.forn)}" placeholder="Para quem vai a garantia"><datalist id="fornList">${[...new Set(ocs.map(o=>o.fornecedor).filter(Boolean))].map(f=>`<option value="${esc(f)}">`).join('')}</datalist></div>
  <div class="field"><label class="lbl" for="idq">ID da quebra</label><input id="idq" class="mono" value="${esc(d.idq)}" placeholder="ID da baixa no sistema"></div></div></div>`:''}
  <div class="field"><label class="lbl" for="fab">Fabricante</label><input id="fab" value="${esc(d.fab)}" placeholder="Ex.: Bosch, Cobreq, Monroe"></div>
  <div class="field"><label class="lbl" for="obs">Observação</label><textarea id="obs">${esc(d.obs)}</textarea></div>
  <div class="err" id="ferr" hidden></div>
  <button class="btn primary" type="submit">Salvar ocorrência</button>
  <button class="btn" type="button" id="limpar">Limpar</button></form>`}
function ler(){draft.tipo=(document.querySelector('input[name=tipo]:checked')||{}).value||'';
  ['sku','produto','fab','qtd','obs'].forEach(k=>draft[k]=$(k).value.trim());if($('qs')){draft.qs=$('qs').value.trim();draft.qc=$('qc').value.trim();$('difview').innerHTML=difHTML(draft.qs!==''&&draft.qc!==''?(+draft.qc)-(+draft.qs):null)}if($('forn')){draft.forn=$('forn').value.trim();draft.idq=$('idq').value.trim()}}
const caminho=ext=>`${uid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
async function enviar(blob,ext,tipo){const p=caminho(ext);const {error}=await sb.storage.from(BUCKET).upload(p,blob,{contentType:tipo,upsert:false});if(error)throw error;return p}
function removerArquivos(paths){if(paths.length)sb.storage.from(BUCKET).remove(paths).catch(()=>{})}
function bindForm(){const fm=$('fnova');fm.addEventListener('input',ler);fm.addEventListener('change',ler);
  document.querySelectorAll('[data-ncat]').forEach(b=>b.addEventListener('click',()=>{ler();draft.cat=b.dataset.ncat;if(!(TIPOS_CAT[draft.cat]||[]).includes(draft.tipo))draft.tipo='';if(draft.cat!=='Minucioso')draft.setor='';if(draft.cat!=='Garantia')draft.origem='';render()}));
  document.querySelectorAll('[data-nset]').forEach(b=>b.addEventListener('click',()=>{ler();draft.setor=b.dataset.nset;render()}));
  document.querySelectorAll('[data-orig]').forEach(b=>b.addEventListener('click',()=>{ler();draft.origem=b.dataset.orig;render()}));
  const fi=$('foto');if(fi)fi.addEventListener('change',async e=>{ler();const files=[...e.target.files].slice(0,4-draft.fotos.length);const d=draft;
    for(const f of files){enviando++;render();try{const {blob,prev}=await comprimir(f);const path=await enviar(blob,'jpg','image/jpeg');d.fotos.push({path,prev})}catch(x){toast(x&&x.message?erroMsg(x):'Não foi possível ler essa imagem')}enviando--}
    if(draft===d&&ui.tab==='nova')render()});
  const vi=$('video');if(vi)vi.addEventListener('change',async e=>{ler();const f=e.target.files[0];if(!f)return;const d=draft;
    if(f.size>MAX_VIDEO){toast('Vídeo grande demais (máx. 50 MB). Grave um vídeo mais curto.');return}
    const ext=/webm/.test(f.type)?'webm':/quicktime/.test(f.type)?'mov':'mp4';
    enviando++;render();try{const path=await enviar(f,ext,f.type||'video/mp4');d.videos.push({path,prev:URL.createObjectURL(f)})}catch(x){toast(erroMsg(x))}enviando--;
    if(draft===d&&ui.tab==='nova')render()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ler();const [f]=draft.fotos.splice(+b.dataset.rm,1);if(f)removerArquivos([f.path]);render()}));
  document.querySelectorAll('[data-rmv]').forEach(b=>b.addEventListener('click',()=>{ler();const [v]=draft.videos.splice(+b.dataset.rmv,1);if(v)removerArquivos([v.path]);render()}));
  $('limpar').addEventListener('click',()=>{removerArquivos([...draft.fotos,...draft.videos].map(x=>x.path));draft=novo();render()});
  fm.addEventListener('submit',async e=>{e.preventDefault();if(saving)return;if(enviando){toast('Aguarde as fotos e vídeos terminarem de enviar');return}ler();const er=$('ferr');
    const minu=draft.cat==='Minucioso';if(minu)draft.tipo='Minucioso';
    if(minu&&!draft.setor){er.textContent='Escolha o setor da contagem.';er.hidden=false;return}
    if(!draft.cat||!draft.tipo||(draft.cat==='Garantia'&&!draft.origem)){er.textContent=!draft.cat?'Escolha Garantia, Relatório ou Minucioso.':(draft.cat==='Garantia'&&!draft.origem)?'Escolha a origem da quebra.':'Escolha o tipo.';er.hidden=false;return}
    const mid=[draft.fotos.length?draft.fotos.length+' foto(s)':'',draft.videos.length?draft.videos.length+' vídeo(s)':''].filter(Boolean).join(' e ');
    const gar=draft.cat==='Garantia';
    const o={setor:minu?draft.setor:null,chefe:minu?(chefeDe(draft.setor)||null):null,qtd_sistema:minu&&draft.qs!==''?+draft.qs:null,qtd_contada:minu&&draft.qc!==''?+draft.qc:null,categoria:draft.cat,fornecedor:gar&&draft.forn||null,id_quebra:gar&&draft.idq||null,gar_status:gar?'Pendente':null,origem:gar?draft.origem:null,tipo:draft.tipo,endereco:'',sku:draft.sku||null,produto:draft.produto||null,fab:draft.fab||null,qtd:draft.qtd?+draft.qtd:null,obs:draft.obs||null,
      fotos:draft.fotos.map(f=>f.path),videos:draft.videos.map(v=>v.path),autor:uid,status:'registrada',hist:[{t:new Date().toISOString(),por:uid,txt:'Registrada'+(mid?' com '+mid:'')}]};
    saving=true;const {error}=await sb.from('ocorrencias').insert(o);saving=false;
    if(error){er.textContent=erroMsg(error);er.hidden=false;return}
    draft.fotos.forEach(f=>{urls[f.path]={url:f.prev,ate:Date.now()+50*60e3}});
    const msgOk=draft.cat==='Garantia'?'Garantia registrada':draft.cat==='Minucioso'?'Contagem registrada':'Relatório registrado';draft=null;toast(msgOk);go('lista')})}
function comprimir(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-28,c.width,28);x.fillStyle='#fff';x.font='16px monospace';x.fillText(fData(Date.now()),10,c.height-9);
  const prev=c.toDataURL('image/jpeg',0.7);c.toBlob(b=>b?res({blob:b,prev}):rej(new Error('imagem')),'image/jpeg',0.7)};img.src=r.result};r.readAsDataURL(file)})}

/* ---------- Minucioso (ficha para impressão) ---------- */

  <div class="field"><label class="lbl" for="mmchefe">Motivo chefe setor</label><textarea id="mmchefe" placeholder="Normalmente o chefe escreve à mão na folha impressa">${esc(d.motivo_chefe)}</textarea></div>
  <div class="field"><label class="lbl" for="mmallan">Motivo Allan</label><textarea id="mmallan">${esc(d.motivo_allan)}</textarea></div></div></details>
  <div class="err" id="ferr" hidden></div>

  <button class="btn" type="submit" data-imp="0">Só salvar</button>
  <button class="btn" type="button" id="limpar">Limpar</button></form>`}
function lerMin(){const g=id=>$(id).value.trim();draft.chefe=g('mchefe');draft.sku=g('msku');draft.fab=g('mfab');draft.produto=g('mdesc');draft.custo=g('mcusto');draft.falta=g('mfalta');
  draft.motivo_inventario=g('mminv');draft.motivo_chefe=g('mmchefe');draft.motivo_allan=g('mmallan');
  const c=Number(String(draft.custo).replace(/\./g,'').replace(',','.')),f=Number(draft.falta);$('mtotal').textContent=(draft.custo!==''&&draft.falta!==''&&!isNaN(c))?brl(c*f):'—'}
const numBR=s=>{if(s===''||s==null)return null;const t=String(s).trim();const n=Number(/,/.test(t)?t.replace(/\./g,'').replace(',','.'):t);return isNaN(n)?null:n};
function bindMinForm(){const fm=$('fmin');fm.addEventListener('input',lerMin);
  document.querySelectorAll('[data-ncat]').forEach(b=>b.addEventListener('click',()=>{lerMin();draft.cat=b.dataset.ncat;render()}));
  document.querySelectorAll('[data-nset]').forEach(b=>b.addEventListener('click',()=>{lerMin();draft.setor=b.dataset.nset;draft.chefe=chefeDe(draft.setor)||draft.chefe;render()}));
  $('limpar').onclick=()=>{draft=novo();draft.cat='Minucioso';render()};
  let imp=true;fm.querySelectorAll('[data-imp]').forEach(b=>b.addEventListener('click',()=>{imp=b.dataset.imp==='1'}));
  fm.addEventListener('submit',async e=>{e.preventDefault();if(saving)return;lerMin();const er=$('ferr');
    const falta=numBR(draft.falta),custo=numBR(draft.custo);
    const m=!draft.setor?'Escolha o setor.':!draft.sku?'Informe o código do produto.':falta==null?'Informe a quantidade em falta.':(draft.custo!==''&&custo==null)?'O custo está em formato inválido. Use, por exemplo, 12,50.':'';
    if(m){er.textContent=m;er.hidden=false;return}
    const o={categoria:'Minucioso',tipo:'Minucioso',endereco:'',setor:draft.setor,chefe:draft.chefe||null,sku:draft.sku,produto:draft.produto||null,fab:draft.fab||null,custo,falta,qtd:falta,
      motivo_inventario:draft.motivo_inventario||null,motivo_chefe:draft.motivo_chefe||null,motivo_allan:draft.motivo_allan||null,fotos:[],videos:[],autor:uid,status:'registrada',hist:[{t:new Date().toISOString(),por:uid,txt:'Registrado'}]};
    saving=true;const {data,error}=await sb.from('ocorrencias').insert(o).select().single();saving=false;
    if(error){er.textContent=erroMsg(error);er.hidden=false;return}
    const novoReg=data||{...o,id:'tmp'+Date.now(),criado:new Date().toISOString()};ocs.unshift(novoReg);
    draft=null;toast('Relatório minucioso salvo');ui={...ui,tab:'lista',cat:'Minucioso',det:novoReg.id};render();scrollTo(0,0);
    if(imp)setTimeout(()=>imprimirMin([novoReg]),300)})}
function folhaMin(o){const linha=(r,v,cl='')=>`<tr><th>${r}</th><td class="${cl}">${esc(v??'')}</td></tr>`;
  return`<div class="folha"><table class="ficha">

  ${linha('SETOR',o.setor,'cinza')}${linha('CHEFE SETOR',o.chefe)}${linha('PRODUTO',o.sku)}${linha('DESCRIÇÃO',o.produto)}${linha('FABRICANTE',o.fab,'cinza')}
  ${linha('CUSTO',o.custo!=null?brl(o.custo):'')}${linha('FALTA',o.falta)}${linha('TOTAL',totalMin(o)!=null?brl(totalMin(o)):'')}

function imprimirMin(lista){let a=$('printArea');if(!a){a=document.createElement('div');a.id='printArea';document.body.appendChild(a)}

function minDetHTML(o){const ed=pode('garantia')||o.autor===uid;

const ANO_ATUAL=new Date().getFullYear(),ANOS=Array.from({length:ANO_ATUAL+5-2015+1},(_,i)=>2015+i);
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mesCurto=k=>{const [y,m]=k.split('-');return MESES[+m-1]+'/'+y.slice(2)};
const mesLongo=k=>{const [y,m]=k.split('-');return MESES_L[+m-1]+' de '+y};
function ultimosMeses(n){const d=new Date(),r=[];for(let i=n-1;i>=0;i--)r.push(mesKey(new Date(d.getFullYear(),d.getMonth()-i,1)));return r}
function mensalHTML(){
  const atual=mesKey(Date.now());if(!ui.mes)ui.mes=atual;
  const conta=k=>{const r={g:0,r:0,m:0,gp:0};ocs.forEach(o=>{if(mesKey(o.criado)!==k)return;if(o.categoria==='Garantia'){r.g++;if((o.gar_status||'Pendente')==='Pendente')r.gp++}else if(o.categoria==='Minucioso')r.m++;else r.r++});return r};
  const ano=ui.mes.slice(0,4),meses=Array.from({length:12},(_,i)=>ano+'-'+String(i+1).padStart(2,'0')),dados=meses.map(k=>({k,...conta(k)}));
  const totAno=dados.reduce((a,d)=>({g:a.g+d.g,r:a.r+d.r,m:a.m+d.m}),{g:0,r:0,m:0});
  const sel=conta(ui.mes);
  const mx=Math.max(1,...dados.map(d=>Math.max(d.g,d.r,d.m)));const passo=mx<=5?1:mx<=10?2:mx<=25?5:mx<=50?10:Math.ceil(mx/50)*10;const top=Math.ceil(mx/passo)*passo;
  const W=innerWidth<520?360:600,H=innerWidth<520?220:230,L=28,R=6,T=18,B=34,ph=H-T-B,gw=(W-L-R)/dados.length,bw=Math.min(18,gw*0.26);
  const y=v=>T+ph-(v/top)*ph;
  let svg='';for(let v=0;v<=top;v+=passo){svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`}
  dados.forEach((d,i)=>{const cx=L+gw*i+gw/2,on=d.k===ui.mes;
    svg+=`<g class="mg" data-mes="${d.k}" role="button" tabindex="0" aria-label="${mesLongo(d.k)}: ${d.g} garantias, ${d.r} relatórios">`;
    svg+=`<rect x="${L+gw*i+2}" y="${T}" width="${gw-4}" height="${ph+B-4}" rx="6" class="${on?'sel':'hit'}"/>`;
    [[d.g,'bg',-bw*1.5-2],[d.r,'br',-bw/2],[d.m,'bm',bw/2+2]].forEach(([v,c,dx])=>{const h=(v/top)*ph;svg+=`<rect x="${cx+dx}" y="${y(v)}" width="${bw}" height="${Math.max(h,v?2:0)}" rx="3" class="${c}"/>`;if(v)svg+=`<text x="${cx+dx+bw/2}" y="${y(v)-5}" text-anchor="middle" class="vl${gw<40?' mini':''}">${v}</text>`});
    svg+=`<text x="${cx}" y="${H-12}" text-anchor="middle" class="ax${on?' on':''}">${MESES[+d.k.slice(5)-1]}</text></g>`});
  return`<span class="lbl">Registros por mês</span>
  <div class="box stack" style="gap:12px">
   <div class="mesrow"><select id="rano" aria-label="Ano">${ANOS.map(a=>`<option ${String(a)===ano?'selected':''}>${a}</option>`).join('')}</select><select id="rmes" aria-label="Mês">${MESES_L.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${String(i+1).padStart(2,'0')===ui.mes.slice(5)?'selected':''}>${m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select></div>
   <div class="mesnum"><div><span class="dot bg"></span><b>${sel.g}</b> ${sel.g===1?'garantia':'garantias'}${sel.g?`<div class="muted small">${sel.gp} pendente${sel.gp===1?'':'s'} · ${sel.g-sel.gp} enviada${sel.g-sel.gp===1?'':'s'}</div>`:''}</div><div><span class="dot br"></span><b>${sel.r}</b> ${sel.r===1?'relatório':'relatórios'}</div><div><span class="dot bm"></span><b>${sel.m}</b> ${sel.m===1?'minucioso':'minuciosos'}</div><div><b>${sel.g+sel.r+sel.m}</b> no total em ${MESES_L[+ui.mes.slice(5)-1]}</div></div>
   <div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" class="mchart" role="img" aria-label="Gráfico mês a mês do ano">${svg}</svg></div>
   <div class="legend"><span><span class="dot bg"></span>Garantia</span><span><span class="dot br"></span>Relatório</span><span><span class="dot bm"></span>Minucioso</span><span class="muted">Ano de ${ano}: ${totAno.g} garantias, ${totAno.r} relatórios e ${totAno.m} minuciosos</span></div>
  </div>`}
function bindResumo(){const a=$('rano'),m=$('rmes');if(a)a.onchange=()=>{ui.mes=a.value+'-'+ui.mes.slice(5);render()};if(m)m.onchange=()=>{ui.mes=ui.mes.slice(0,4)+'-'+m.value;render()};
  document.querySelectorAll('.mg').forEach(g=>{const f=()=>{ui.mes=g.dataset.mes;render()};g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})})}
function resumoHTML(){const c={hoje:0,sete:0,total:ocs.length};ocs.forEach(o=>{const d=dia(o.criado);if(d===hoje())c.hoje++;if(d>=diasAtras(6))c.sete++});
  const cont=f=>{const m={};ocs.forEach(o=>{const k=f(o);m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,8)};
  const bars=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return a.length?a.map(([n,v])=>`<div class="bar"><span class="n">${esc(n)}</span><div class="tr"><div class="f" style="width:${v/mx*100}%"></div></div><span class="v">${v}</span></div>`).join(''):'<span class="muted small">Sem dados</span>'};
  return`<div class="stack"><div class="stats">${[['hoje','Hoje'],['sete','Últimos 7 dias'],['total','Total']].map(([k,t])=>`<div class="stat"><div class="v">${c[k]}</div><div class="muted small">${t}</div></div>`).join('')}</div>
  ${mensalHTML()}
  ${(()=>{const g=ocs.filter(o=>o.categoria==='Garantia');if(!g.length)return'';const k={};GST.forEach(s=>k[s]=0);g.forEach(o=>k[o.gar_status||'Pendente']++);
    const pf={};g.forEach(o=>{const f=o.fornecedor||'Sem fornecedor';pf[f]=(pf[f]||0)+1});
    return`<span class="lbl">Garantias</span><div class="stats g4">${GST.map(s=>`<div class="stat"><div class="v">${k[s]}</div><div class="muted small">${s}</div></div>`).join('')}</div>
    <span class="lbl">Garantias por origem da quebra</span><div class="box stack" style="gap:8px">${bars(Object.entries(g.reduce((m,o)=>{const k=o.origem||'Não informada';m[k]=(m[k]||0)+1;return m},{})).sort((a,b)=>b[1]-a[1]))}</div>
    <span class="lbl">Garantias por fornecedor</span><div class="box stack" style="gap:8px">${bars(Object.entries(pf).sort((a,b)=>b[1]-a[1]).slice(0,8))}</div>`})()}
  ${(()=>{const m=ocs.filter(o=>o.categoria==='Minucioso');if(!m.length)return'';const c={},dd={};m.forEach(o=>{const s=o.setor||'Sem setor';c[s]=(c[s]||0)+1;dd[s]=(dd[s]||0)+(totalMin(o)||0)});
    return`<span class="lbl">Minucioso: relatórios por setor</span><div class="box stack" style="gap:8px">${bars(Object.entries(c).sort((a,b)=>b[1]-a[1]))}</div>
    <span class="lbl">Minucioso: valor em falta por setor</span><div class="box stack" style="gap:8px">${Object.entries(dd).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div class="bar" style="grid-template-columns:minmax(0,10rem) 1fr auto"><span class="n">${esc(n)}</span><div class="tr"><div class="f" style="width:${v/Math.max(...Object.values(dd))*100}%"></div></div><span class="v">${brl(v)}</span></div>`).join('')||'<span class="muted small">Sem valores</span>'}</div>`})()}
  <span class="lbl">Por categoria</span><div class="box stack" style="gap:8px">${bars(cont(o=>o.categoria||'Relatório'))}</div>
  <span class="lbl">Por tipo</span><div class="box stack" style="gap:8px">${bars(cont(o=>o.categoria==='Minucioso'?null:o.tipo).filter(x=>x[0]!=='null'))}</div>
  <span class="lbl">Por pessoa</span><div class="box stack" style="gap:8px">${bars(cont(o=>nome(o.autor)))}</div></div>`}

function equipeHTML(){const todos=Object.values(perfis).sort((a,b)=>ts(b.criado)-ts(a.criado));
  const pend=todos.filter(p=>!p.aprovado&&!p.admin&&!p.recusado),ativos=todos.filter(p=>p.aprovado||p.admin),recus=todos.filter(p=>!p.aprovado&&!p.admin&&p.recusado);

  const lAtivo=p=>`<div class="person">${info(p,esc(cargoNome(p.cargo))+(p.admin?' · administrador':''))}${p.id!==uid&&!p.admin?`<div class="ctl"><select data-cg="${esc(p.id)}" data-ativo="1" aria-label="Cargo de ${esc(p.nome)}">${opcoes(p,cargoNome(p.cargo))}</select><button class="btn sm" data-rev="${esc(p.id)}">Remover acesso</button></div>`:`<span class="pill">${p.admin?'Admin':esc(cargoNome(p.cargo))}</span>`}</div>`;
  const lRec=p=>`<div class="person">${info(p,'<span class="nao">Não liberado</span>')}<div class="ctl">${ui.confExcl===p.id?`<span class="small" style="font-weight:700">Excluir de vez?</span><div class="ctl2"><button class="btn sm danger" data-exsim="${esc(p.id)}">Excluir</button><button class="btn sm" data-exnao="1">Cancelar</button></div>`:`<div class="ctl2"><button class="btn sm" data-rec="${esc(p.id)}">Reconsiderar</button><button class="btn sm danger" data-excl="${esc(p.id)}">Excluir</button></div>`}</div></div>`;
  return`<div class="stack">
  <div class="box"><div class="row"><b>${pend.length?pend.length+(pend.length>1?' cadastros aguardando':' cadastro aguardando'):'Nenhum cadastro aguardando'}</b>${pend.length?'<span class="pill new">Novo</span>':''}</div>
  <p class="muted small" style="margin:4px 0 0">Escolha o cargo e toque em <b>Liberar</b>, ou em <b>Não liberar</b> se a pessoa não deve ter acesso.</p>
  ${pend.length?`<div style="margin-top:12px">${pend.map(lPend).join('')}</div>`:''}</div>
  <span class="lbl">Com acesso (${ativos.length})</span><div class="box">${ativos.map(lAtivo).join('')||'<span class="muted">Ninguém.</span>'}</div>
  ${recus.length?`<span class="lbl">Não liberados (${recus.length})</span><div class="box">${recus.map(lRec).join('')}<p class="muted small" style="margin:12px 0 0">Excluir apaga o cadastro e o login da pessoa. Ela poderá se cadastrar de novo com o mesmo e-mail, se quiser.</p></div>`:''}
  <span class="lbl">Chefes dos setores</span><div class="box"><datalist id="pessoasList">${ativos.map(p=>`<option value="${esc(p.nome)}">`).join('')}</datalist>
  ${SETORES.map((s,i)=>`<div class="chefrow"><b>${esc(s)}</b><input id="chef${i}" list="pessoasList" value="${esc(chefeDe(s))}" placeholder="Nome do chefe"><button class="btn sm" data-chef="${i}">Salvar</button></div>`).join('')}
  <p class="muted small" style="margin:10px 0 0">O chefe aparece no Minucioso e fica gravado em cada contagem do setor.</p></div>
  <details class="box small"><summary><b>O que cada cargo pode fazer</b></summary><ul style="margin:10px 0 0;padding-left:18px">${Object.entries(CARGO_DESC).map(([c,d])=>`<li><b>${c}</b>: ${d}</li>`).join('')}</ul></details></div>`}
async function mudaPerfil(id,campos,msg){const {error}=await sb.from('perfis').update(campos).eq('id',id);if(error){toast(erroMsg(error));return}Object.assign(perfis[id],campos);toast(msg);render()}
function bindEquipe(){
  document.querySelectorAll('[data-chef]').forEach(b=>b.addEventListener('click',async()=>{const i=+b.dataset.chef,s=SETORES[i],v=$('chef'+i).value.trim();b.disabled=true;
    const {error}=await sb.from('setores').upsert({nome:s,chefe:v||null,ordem:i});b.disabled=false;
    if(error){toast(/schema cache|does not exist|relation/i.test(error.message)?'O banco precisa de uma atualização (tabela setores). Rode o comando novo no SQL Editor. Detalhe: '+error.message:/row-level security/i.test(error.message)?'Sem permissão para salvar o chefe. Só o administrador pode. Detalhe: '+error.message:erroMsg(error));return}
    chefes[s]=v;toast(v?'Chefe de '+s+': '+v:'Chefe de '+s+' removido')}));
  document.querySelectorAll('select[data-ativo]').forEach(s=>s.addEventListener('change',()=>mudaPerfil(s.dataset.cg,{cargo:s.value},'Cargo alterado para '+s.value)));
  document.querySelectorAll('[data-ok]').forEach(b=>b.addEventListener('click',()=>{b.disabled=true;const cg=document.querySelector(`select[data-cg="${b.dataset.ok}"]`).value;mudaPerfil(b.dataset.ok,{aprovado:true,recusado:false,cargo:cg},'Acesso liberado como '+cg)}));
  document.querySelectorAll('[data-nao]').forEach(b=>b.addEventListener('click',()=>{b.disabled=true;mudaPerfil(b.dataset.nao,{aprovado:false,recusado:true},'Cadastro não liberado')}));
  document.querySelectorAll('[data-rev]').forEach(b=>b.addEventListener('click',()=>{b.disabled=true;mudaPerfil(b.dataset.rev,{aprovado:false,recusado:true},'Acesso removido')}));
  document.querySelectorAll('[data-excl]').forEach(b=>b.addEventListener('click',()=>{ui.confExcl=b.dataset.excl;render()}));
  document.querySelectorAll('[data-exnao]').forEach(b=>b.addEventListener('click',()=>{ui.confExcl=null;render()}));
  document.querySelectorAll('[data-exsim]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;const id=b.dataset.exsim;
    const {error}=await sb.rpc('excluir_usuario',{alvo:id});ui.confExcl=null;
    if(error){toast(/excluir_usuario|function|schema cache/i.test(error.message)&&!/administrador|liberados|si mesmo/.test(error.message)?'O banco precisa de uma atualização para excluir usuários. Rode o comando novo no SQL Editor.':erroMsg(error));render();return}
    delete perfis[id];toast('Usuário excluído');render()}));
  document.querySelectorAll('[data-rec]').forEach(b=>b.addEventListener('click',()=>{b.disabled=true;mudaPerfil(b.dataset.rec,{recusado:false},'Cadastro voltou para aguardando')}));
}

function telaConfig(){document.body.classList.add('auth');
  $('view').innerHTML=`<div class="stack">
  <div class="box stack"><div><h2>Configuração inicial</h2><p class="muted small" style="margin:0">Feita uma única vez pelo administrador. Leva uns 10 minutos.</p></div>
  <ol class="steps">
   <li>Crie uma conta gratuita em <b>supabase.com</b> e clique em <b>New project</b>. Dê o nome <code>inventario-cd</code>, crie uma senha para o banco (guarde-a) e escolha a região <b>South America (São Paulo)</b>.</li>
   <li>Quando o projeto terminar de criar, abra <b>SQL Editor</b> no menu da esquerda, clique em <b>New query</b>, cole o código copiado pelo botão abaixo e clique em <b>Run</b>. Deve aparecer "Success".<div style="margin-top:8px"><button class="btn sm" id="copiarSql">Copiar código do banco</button> <span class="ok small" id="sqlOk" hidden>Copiado</span></div><textarea id="sqlBox" readonly hidden style="margin-top:8px;min-height:140px;font-family:var(--mono);font-size:.75rem"></textarea></li>
   <li>Em <b>Authentication</b> → <b>Sign In / Providers</b> → <b>Email</b>, desligue <b>Confirm email</b> e salve. Assim a equipe entra logo após o cadastro, sem precisar abrir o e-mail. Se preferir manter a confirmação, cada pessoa recebe um e-mail ao se cadastrar.</li>
   <li>Em <b>Project Settings</b> → <b>API Keys</b>, copie a chave <b>anon public</b> (aba Legacy) ou a <b>Publishable key</b>. Em <b>Project Settings</b> → <b>Data API</b>, copie a <b>Project URL</b>. Cole as duas abaixo.</li>
  </ol></div>
  <form class="box stack" id="fcfg" novalidate>
   <div class="field"><label class="lbl" for="cfgUrl">Project URL</label><input id="cfgUrl" class="mono" placeholder="https://xxxx.supabase.co"></div>
   <div class="field"><label class="lbl" for="cfgKey">Chave anon public / Publishable key</label><input id="cfgKey" class="mono" placeholder="eyJ... ou sb_publishable_..."></div>
   <div id="cfgMsg" hidden></div>
   <button class="btn primary" type="submit">Testar conexão</button>
   <button class="btn" type="button" id="baixar" disabled>Baixar arquivo configurado</button>
   <button class="btn" type="button" id="baixarCfg" disabled>Baixar config.js (para site no GitHub)</button>
   <p class="muted small" style="margin:0">O arquivo baixado já vem com a conexão pronta. Use esse arquivo daqui em diante e copie-o para os outros computadores. <b>A primeira pessoa que se cadastrar vira administrador</b>, então faça o seu cadastro primeiro.</p>
  </form></div>`;
  $('copiarSql').onclick=()=>{const t=$('sql').textContent.trim();const box=$('sqlBox');
    const fb=()=>{box.value=t;box.hidden=false;box.select();toast('Selecione o texto e copie com Ctrl+C')};
    try{navigator.clipboard.writeText(t).then(()=>{$('sqlOk').hidden=false},fb)}catch(e){fb()}};
  let cfg=null;
  if(window.top!==window){$('view').insertAdjacentHTML('afterbegin','<div class="box err" style="margin-bottom:14px">Este arquivo está aberto dentro de outro aplicativo, e assim a conexão não funciona. Baixe o arquivo inventario-cd.html, abra a pasta Downloads e dê dois cliques nele para abrir no Chrome ou no Edge.</div>')}
  $('fcfg').addEventListener('submit',async e=>{e.preventDefault();const m=$('cfgMsg'),btn=e.target.querySelector('[type=submit]');
    let url=$('cfgUrl').value.trim().replace(/\s/g,''),key=$('cfgKey').value.trim().replace(/\s/g,'');
    const ref=url.match(/project\/([a-z0-9]{10,})/i);if(ref)url='https://'+ref[1]+'.supabase.co';
    if(url&&!/^https?:\/\//.test(url))url='https://'+url;
    url=url.replace(/\/(rest|auth)\/v1.*$/,'').replace(/\/+$/,'');$('cfgUrl').value=url;$('cfgKey').value=key;
    const show=(ok,t)=>{m.className=ok?'ok':'err';m.textContent=t;m.hidden=false;m.scrollIntoView({block:'center',behavior:'smooth'})};
    if(!/^https:\/\/[^/]+\.[a-z]+/.test(url)){show(false,'A Project URL parece errada. Ela tem o formato https://xxxx.supabase.co e fica em Project Settings → Data API.');return}
    if(key.length<20){show(false,'A chave parece incompleta. Copie a chave inteira (anon public, que começa com eyJ, ou a Publishable key, que começa com sb_publishable_).');return}
    if(/^sb_secret_/.test(key)||/service_role/.test(atobSeguro(key))){show(false,'Essa é a chave secreta (service_role / secret). Use a chave anon public ou a Publishable key.');return}
    show(true,'Testando…');btn.disabled=true;
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
    try{const h={apikey:key};if(/^eyJ/.test(key))h.Authorization='Bearer '+key;
      const r=await fetch(url+'/rest/v1/ocorrencias?select=id&limit=1',{headers:h,signal:ctl.signal});
      let corpo='';try{corpo=await r.text()}catch(x){}
      if(r.ok){cfg={url,key};$('baixar').disabled=false;$('baixarCfg').disabled=false;
        show(true,window.supabase?'Conexão funcionando. Agora clique em Baixar arquivo configurado.':'O banco respondeu, mas este computador não carregou um componente do app (cdn.jsdelivr.net). Baixe o arquivo configurado e teste; se não abrir, a rede da empresa pode estar bloqueando esse endereço.')}
      else if(r.status===401||r.status===403||/Invalid API key|No API key/i.test(corpo))show(false,'O servidor recusou a chave (erro '+r.status+'). Copie de novo a chave anon public ou a Publishable key, inteira.');
      else if(r.status===404||/PGRST205|42P01|does not exist|schema cache/i.test(corpo))show(false,'Conectou, mas o banco não está pronto. Refaça o passo 2: cole o código do banco no SQL Editor e clique em Run.');
      else show(false,'O servidor respondeu com erro '+r.status+'. '+corpo.slice(0,160))}
    catch(x){show(false,x.name==='AbortError'?'O servidor não respondeu em 15 segundos. Confira a Project URL. Se estiver certa, a rede da empresa pode estar bloqueando o endereço supabase.co.':'Não foi possível chegar ao servidor. Confira a Project URL. Se estiver certa, a rede da empresa pode estar bloqueando o endereço supabase.co (teste em outra rede, como o 4G do celular).')}
    clearTimeout(timer);btn.disabled=false});
  const baixa=(nomeArq,txt,tipo)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nomeArq;document.body.appendChild(a);a.click();a.remove()};
  $('baixarCfg').onclick=()=>{if(!cfg)return;baixa('config.js','window.INV_CONFIG='+JSON.stringify(cfg)+';\n','text/javascript');toast('config.js baixado. Envie para o repositório junto com o index.html.')};
  $('baixar').onclick=()=>{if(!cfg)return;
    const html=ORIGINAL.replace("const SUPABASE_URL='';const SUPABASE_KEY='';",`const SUPABASE_URL=${JSON.stringify(cfg.url)};const SUPABASE_KEY=${JSON.stringify(cfg.key)};`);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='inventario-cd.html';document.body.appendChild(a);a.click();a.remove();
    toast('Arquivo baixado. Abra o inventario-cd.html da pasta Downloads.')};
}

init();
</script>
</body>
</html>
