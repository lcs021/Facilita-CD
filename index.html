<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inventário CD</title>
<style>
/* Layout: uma coluna estreita, cabeçalho simples, abas fixas embaixo */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --sunken:#eceef0; --line:#dcdfe3;
  --fg:#1f2329; --muted:#646b75; --accent:#1f5fbf; --accent-ink:#ffffff;
  --alta:#c4362b; --baixa:#3f7a50; --gar:#d0661f;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#15181c; --surface:#1d2126; --sunken:#262b31; --line:#353b43;
  --fg:#e8eaed; --muted:#9aa1ab; --accent:#6ea0ea; --accent-ink:#0f1215;
  --alta:#ef6a5e; --baixa:#78b189; --gar:#e9894a; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:14px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line);margin-bottom:16px}
h1{font-size:1.15rem;margin:0;font-weight:700;white-space:nowrap}
.hdr{display:flex;align-items:center;gap:10px;min-width:0}
.who{font-size:.85rem;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:1.2rem;margin:0 0 4px}
h3{font-size:1rem;margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.mono{font-family:var(--mono)}
.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--muted);font:600 .85rem var(--font);padding:13px 2px;cursor:pointer;position:relative}
nav button[aria-current="true"]{color:var(--accent)}
nav .badge{position:absolute;top:6px;margin-left:2px;background:var(--alta);color:#fff;border-radius:999px;font-size:.68rem;padding:0 6px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 1rem var(--font);border-radius:6px;padding:12px 16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{font-size:.85rem;padding:7px 12px}
.btn.danger{color:var(--alta)}
.btn.link{border:0;background:none;color:var(--accent);padding:4px;font-size:.9rem}
.btn:disabled{opacity:.55;cursor:default}
.stack{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.center{max-width:440px;margin:24px auto 0}
.err{color:var(--alta);font-size:.9rem;font-weight:600}
.ok{color:var(--baixa);font-size:.9rem;font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters>*{flex:1 1 160px;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:none;padding:8px 6px;font:600 .85rem var(--font);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:64px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;width:100%}
.thumb{background:var(--sunken);position:relative;min-height:78px;display:grid;place-items:center;color:var(--muted);font-size:.7rem;text-align:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .b{padding:9px 12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.t{font-weight:700}
.line{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{font-family:var(--mono);font-size:.82rem;background:var(--sunken);padding:1px 6px;border-radius:3px}
.st{font-size:.75rem;font-weight:700;white-space:nowrap}
.st.aberta{color:var(--alta)} .st.tratamento{color:var(--accent)} .st.resolvida{color:var(--baixa)}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:1px dashed var(--line);border-radius:8px}
.radios{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 10px;font-size:.92rem;cursor:pointer}
.radios input{width:auto;accent-color:var(--accent)}
.radios label:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pick.l{grid-template-columns:repeat(9,1fr);gap:4px}
.pick button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font:inherit;min-width:0}
.pick button b{font-size:1.05rem;font-family:var(--mono)}
.pick button small{font-size:.72rem;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick button[aria-pressed="true"] small{color:var(--accent-ink)}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line);border-radius:6px;background:var(--surface);padding:14px 8px;font-weight:600;font-size:.92rem;cursor:pointer;text-align:center}
.addbtn svg{width:22px;height:22px;flex:none;color:var(--accent)}
.addbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.addbtn.off{color:var(--muted);cursor:default;font-weight:500}
.addbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--sunken);max-width:100%;display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.ph button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;z-index:2}
.vb{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;font-size:.7rem;padding:1px 5px;border-radius:3px;z-index:2}
.gallery{display:flex;gap:8px;overflow-x:auto}
.gallery img{height:220px;max-width:85%;border-radius:8px;object-fit:cover;flex:none;background:var(--sunken)}
.vplay{width:100%;max-height:380px;border-radius:8px;background:#000}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.facts dt{color:var(--muted);font-size:.88rem} dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
ul.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.hist li{font-size:.9rem;border-left:2px solid var(--line);padding-left:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap} .actions .btn{flex:1 1 auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat .v{font:700 1.6rem var(--mono)}
.bar{display:grid;grid-template-columns:minmax(0,10rem) 1fr 2rem;gap:10px;align-items:center;font-size:.88rem}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--sunken);border-radius:2px;overflow:hidden}
.bar .f{height:100%;background:var(--accent)}
.bar .v{text-align:right;font-family:var(--mono)}
.person{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person .info{min-width:0}
.ctl{display:flex;flex-direction:column;gap:6px;flex:none;width:11rem}
.ctl select{padding:7px 8px;font-size:.88rem}
.datas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;flex:1 1 280px!important}
.dt{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:.75rem;font-weight:600;color:var(--muted)}
.dt input{padding:7px 6px;min-width:0;width:100%;font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 .85rem var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.limpar{color:var(--alta);border-color:transparent}
.cat{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.cat.gar{background:#fbe3d6;color:#9a3a0c}
.cat.rel{background:var(--sunken);color:var(--muted)}
@media (prefers-color-scheme: dark){.cat.gar{background:#4a2a1a;color:#f3b08a}}
.catpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.catpick button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:12px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;font:inherit}
.catpick button b{font-size:1.05rem}
.catpick button small{font-size:.78rem;color:var(--muted);line-height:1.3}
.catpick button.gar[aria-pressed="true"]{border-color:#c2571a;box-shadow:inset 0 0 0 1px #c2571a;background:#fff4ee}
.catpick button.rel[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
@media (prefers-color-scheme: dark){.catpick button.gar[aria-pressed="true"]{background:#3a2114}}
.gst{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;white-space:nowrap}
.gst.p{background:#fdf0c7;color:#7a5600}.gst.e{background:#dde8fb;color:#1f4f9a}.gst.c{background:#d9f0df;color:#24663a}.gst.r{background:#f6dcda;color:#8f2a22}
@media (prefers-color-scheme: dark){.gst.p{background:#4a3b10;color:#f2d27a}.gst.e{background:#1d3150;color:#a9c6f3}.gst.c{background:#1c3a26;color:#9bd3ab}.gst.r{background:#45201d;color:#f0a39c}}
.gbox{border-color:#e8b896}
@media (prefers-color-scheme: dark){.gbox{border-color:#6b4127}}
.stats.g4{grid-template-columns:repeat(2,1fr)}
@media (max-width:420px){.stats.g4{grid-template-columns:repeat(2,1fr)}}
.mesrow select{max-width:240px}
.mesnum{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem}
.mesnum b{font-size:1.4rem;font-family:var(--mono);margin-right:2px}
.chartwrap{overflow-x:auto}
.mchart{width:100%;height:auto;display:block}
.mchart .gl{stroke:var(--line);stroke-width:1}
.mchart .ax{fill:var(--muted);font-size:12px;font-family:var(--font)}
.mchart .ax.on{fill:var(--fg);font-weight:700}
.mchart .vl{fill:var(--fg);font-size:12px;font-weight:700;font-family:var(--mono)}
.mchart .bg{fill:var(--gar)} .mchart .br{fill:var(--accent)}
.mchart .hit{fill:transparent} .mchart .sel{fill:var(--sunken)}
.mchart .mg{cursor:pointer;outline:none} .mchart .mg:focus-visible .hit{stroke:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}
.dot.bg{background:var(--gar)} .dot.br{background:var(--accent)}
.catpick.g4o{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.catpick.g4o{grid-template-columns:1fr 1fr}}
.exprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap}
.pill.new{background:var(--alta);color:#fff}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.steps li{padding-left:4px}
code{font-family:var(--mono);font-size:.88em;background:var(--sunken);padding:1px 5px;border-radius:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;font-size:.9rem;z-index:20;max-width:90vw}
@media (max-width:420px){.radios{grid-template-columns:1fr}.stat .v{font-size:1.3rem}.ctl{width:9.5rem}}
</style>

<script type="text/plain" id="sql">-- Inventário CD: estrutura do banco (rode uma vez no SQL Editor do Supabase)

-- Tabelas
create table if not exists public.perfis (
  id uuid primary key references auth.users(id) on delete cascade,
  nome text not null default '',
  email text,
  cargo text not null default 'Conferente',
  aprovado boolean not null default false,
  admin boolean not null default false,
  criado timestamptz not null default now()
);

create table if not exists public.ocorrencias (
  id uuid primary key default gen_random_uuid(),
  tipo text not null,
  endereco text not null,
  sku text,
  produto text,
  fab text,
  qtd integer,
  obs text,
  fotos text[] not null default '{}',
  videos text[] not null default '{}',
  autor uuid references public.perfis(id) on delete set null,
  status text not null default 'aberta',
  hist jsonb not null default '[]'::jsonb,
  criado timestamptz not null default now()
);

-- Categoria do registro (Garantia ou Relatório)
alter table public.ocorrencias add column if not exists categoria text not null default 'Relatório';
alter table public.ocorrencias add column if not exists fornecedor text;
alter table public.ocorrencias add column if not exists id_quebra text;
alter table public.ocorrencias add column if not exists gar_status text;
alter table public.ocorrencias add column if not exists origem text;

alter table public.perfis enable row level security;
alter table public.ocorrencias enable row level security;

-- Funções de permissão
create or replace function public.is_aprovado() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select aprovado or admin from public.perfis where id = auth.uid()), false)
$$;

create or replace function public.is_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select admin from public.perfis where id = auth.uid()), false)
$$;

create or replace function public.tem_cargo(cargos text[]) returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select admin or (aprovado and cargo = any(cargos)) from public.perfis where id = auth.uid()), false)
$$;

-- Ao criar uma conta, cria o perfil. A primeira conta vira administrador.
create or replace function public.novo_usuario() returns trigger
language plpgsql security definer set search_path = public as $$
declare primeiro boolean;
begin
  select not exists (select 1 from public.perfis) into primeiro;
  insert into public.perfis (id, nome, email, cargo, aprovado, admin)
  values (new.id, coalesce(new.raw_user_meta_data->>'nome', ''), new.email,
          case when primeiro then 'Supervisor' else 'Conferente' end, primeiro, primeiro);
  return new;
end
$$;

drop trigger if exists ao_criar_usuario on auth.users;
create trigger ao_criar_usuario after insert on auth.users
  for each row execute function public.novo_usuario();

-- Regras de acesso: perfis
drop policy if exists "ver perfis" on public.perfis;
create policy "ver perfis" on public.perfis for select to authenticated
  using (id = auth.uid() or public.is_aprovado());
drop policy if exists "admin altera perfis" on public.perfis;
create policy "admin altera perfis" on public.perfis for update to authenticated
  using (public.is_admin()) with check (public.is_admin());

-- Regras de acesso: ocorrências
drop policy if exists "ver ocorrencias" on public.ocorrencias;
create policy "ver ocorrencias" on public.ocorrencias for select to authenticated
  using (public.is_aprovado());
drop policy if exists "registrar ocorrencias" on public.ocorrencias;
create policy "registrar ocorrencias" on public.ocorrencias for insert to authenticated
  with check (public.is_aprovado() and autor = auth.uid());
drop policy if exists "tratar ocorrencias" on public.ocorrencias;
create policy "tratar ocorrencias" on public.ocorrencias for update to authenticated
  using (public.tem_cargo(array['Líder','Analista de inventário','Supervisor']))
  with check (public.tem_cargo(array['Líder','Analista de inventário','Supervisor']));
drop policy if exists "apagar ocorrencias" on public.ocorrencias;
create policy "apagar ocorrencias" on public.ocorrencias for delete to authenticated
  using (public.tem_cargo(array['Supervisor']));

-- Fotos e vídeos (pasta privada, até 50 MB por arquivo)
insert into storage.buckets (id, name, public, file_size_limit)
values ('midias', 'midias', false, 52428800)
on conflict (id) do nothing;

drop policy if exists "ver midias" on storage.objects;
create policy "ver midias" on storage.objects for select to authenticated
  using (bucket_id = 'midias' and public.is_aprovado());
drop policy if exists "enviar midias" on storage.objects;
create policy "enviar midias" on storage.objects for insert to authenticated
  with check (bucket_id = 'midias' and public.is_aprovado());
drop policy if exists "apagar midias" on storage.objects;
create policy "apagar midias" on storage.objects for delete to authenticated
  using (bucket_id = 'midias' and (owner_id = auth.uid()::text or public.tem_cargo(array['Supervisor'])));
</script>

<script>
/* ===== CONFIGURAÇÃO (preenchida pela tela de configuração) ===== */
const SUPABASE_URL='';const SUPABASE_KEY='';
/* =============================================================== */

const ORIGINAL='<!doctype html>\n'+document.documentElement.outerHTML;
const TIPOS_CAT={'Garantia':['Peça quebrada','Peça com defeito','Embalagem violada','Kit incompleto'],'Relatório':['Avaria / peça quebrada','Embalagem violada','Sem etiqueta / ilegível','Código divergente (peça trocada)','Kit incompleto']};
const ORIGENS={'Loja':'Retirado como quebrado na loja','Fábrica':'Veio quebrado ou com defeito do fabricante','Transporte':'Quebrou no frete ou na entrega','CD':'Quebrou dentro do CD'};
const TIPOS=[...new Set([...TIPOS_CAT['Garantia'],...TIPOS_CAT['Relatório']])];
const CARGOS={'Conferente':['registrar'],'Operador':['registrar'],'Líder':['registrar','resumo','garantia'],'Analista de inventário':['registrar','resumo','garantia'],'Supervisor':['registrar','resumo','garantia','apagar']};
const CARGO_DESC={'Conferente':'registra','Operador':'registra','Líder':'registra, vê o resumo e atualiza garantias','Analista de inventário':'registra, vê o resumo e atualiza garantias','Supervisor':'tudo, inclusive apagar registros'};
const ANDARES={'11':'1º andar','12':'2º andar','13':'3º andar'},LETRAS='ABCDEFGHI'.split('');
const BUCKET='midias',H=3600e3,MAX_VIDEO=50*1024*1024;

let sb=null,uid=null,eu=null,perfis={},ocs=[],carregou=false;
let tela='login',msgLogin='';
let ui={tab:'lista',mes:'',cat:'Garantia',gst:'',busca:'',tipo:'',pessoa:'',de:'',ate:'',det:null,confDel:false};
let draft=null,saving=false,enviando=0;
const urls={},pedindo=new Set();

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ts=t=>new Date(t).getTime();
const fData=t=>{const d=new Date(t);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const idade=t=>{const h=Math.floor((Date.now()-ts(t))/H);return h<1?'agora':h<24?h+'h':Math.floor(h/24)+'d'};
const nome=id=>perfis[id]?.nome||'Alguém';
const pode=a=>!!eu&&(eu.admin||(CARGOS[eu.cargo]||[]).includes(a));
const andarDe=e=>{const m=String(e||'').match(/^(1[123])/);return m?m[1]:''};
let tt;function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3200)}
function erroMsg(e){const m=(e&&(e.message||e.error_description))||'';
  if(/categoria|fornecedor|id_quebra|gar_status|origem/i.test(m))return'O banco precisa de uma atualização (coluna categoria). Peça ao administrador para rodar o comando de atualização no SQL Editor do Supabase.';
  if(/Invalid login credentials/i.test(m))return'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return'Confirme seu e-mail antes de entrar. Veja a mensagem que chegou na sua caixa de entrada.';
  if(/already registered|already been registered/i.test(m))return'Este e-mail já tem cadastro. Use a tela Entrar.';
  if(/Password should be/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';
  if(/row-level security|permission|not authorized|violates/i.test(m))return'Sem permissão para isso. Fale com o administrador.';
  if(/Failed to fetch|NetworkError|network/i.test(m))return'Sem conexão com o servidor. Verifique a internet.';
  if(/exceeded the maximum allowed size|Payload too large/i.test(m))return'Arquivo grande demais.';
  return m?'Erro: '+m:'Algo deu errado. Tente de novo.'}

/* ---------- Início ---------- */
async function init(){
  const CFG=window.INV_CONFIG||{},URL_=SUPABASE_URL||CFG.url,KEY_=SUPABASE_KEY||CFG.key;
  if(!URL_||!KEY_){telaConfig();return}
  if(!window.supabase){$('view').innerHTML='<div class="center box stack"><h2>Sem conexão</h2><p>Não foi possível carregar o app. Verifique se este computador tem acesso à internet e abra o arquivo de novo.</p></div>';return}
  sb=window.supabase.createClient(URL_,KEY_);
  sb.auth.onAuthStateChange((ev,s)=>{const novo=s?.user?.id||null;if(novo!==uid){uid=novo;setTimeout(entrouOuSaiu,0)}});
  const {data}=await sb.auth.getSession();uid=data.session?.user?.id||null;entrouOuSaiu();
  setInterval(()=>{if(eu&&(eu.aprovado||eu.admin)&&!document.hidden&&!ui.det&&ui.tab!=='nova')carregar()},30000);
}
async function entrouOuSaiu(){
  if(!uid){eu=null;perfis={};ocs=[];carregou=false;render();return}
  await carregarPerfil();await carregar();
}
async function carregarPerfil(){
  const {data,error}=await sb.from('perfis').select('*').eq('id',uid).maybeSingle();
  if(error){toast(erroMsg(error))}eu=data||null;
}
async function carregar(){
  if(!uid)return;await carregarPerfil();
  if(eu&&(eu.aprovado||eu.admin)){
    const [p,o]=await Promise.all([sb.from('perfis').select('*').order('criado',{ascending:false}),sb.from('ocorrencias').select('*').order('criado',{ascending:false}).limit(500)]);
    if(p.data){perfis={};p.data.forEach(x=>perfis[x.id]=x)}
    if(o.data)ocs=o.data;
    if(o.error)toast(erroMsg(o.error));
  }
  carregou=true;render();
}
$('sair').addEventListener('click',async()=>{await sb.auth.signOut();tela='login';msgLogin='';draft=null;ui={...ui,tab:'lista',det:null}});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.tab)));
function go(tab){ui={...ui,tab,det:null,confDel:false};if(tab==='nova'&&!draft)draft=novo();render();scrollTo(0,0);if(tab!=='nova')carregar()}
const CATS={'Garantia':'Peça quebrada ou com defeito para acionar a garantia do fornecedor','Relatório':'Registro de fato do inventário, sem garantia'};
const GST=['Pendente','Enviado ao fornecedor'];
const gstCls=s=>({'Pendente':'p','Enviado ao fornecedor':'e','Crédito recebido':'c','Recusada':'r'})[s]||'p';
const gstBadge=o=>o.categoria==='Garantia'?`<span class="gst ${gstCls(o.gar_status)}">${esc(o.gar_status||'Pendente')}</span>`:'';

const catBadge=c=>`<span class="cat ${catCls(c||'Relatório')}">${esc(c||'Relatório')}</span>`;
function novo(){return{cat:'',origem:'',forn:'',idq:'',tipo:'',end:'',andar:'',letra:'',sku:'',produto:'',fab:'',qtd:'',obs:'',fotos:[],videos:[]}}

function render(){
  const v=$('view'),fora=()=>{$('nav').hidden=true;$('sair').hidden=!uid;$('who').textContent=''};
  if(!sb)return;
  if(!uid){fora();if(tela==='cadastro'){v.innerHTML=cadastroHTML();bindCadastro()}else{v.innerHTML=loginHTML();bindLogin()}return}
  if(!carregou){fora();v.innerHTML='<div class="center box"><p class="muted">Carregando…</p></div>';return}
  if(!eu){fora();v.innerHTML='<div class="center box stack"><h2>Perfil não encontrado</h2><p>Sua conta existe, mas o perfil não foi criado. Peça ao administrador para conferir a configuração do banco (passo do SQL).</p></div>';return}
  if(!eu.aprovado&&!eu.admin){fora();v.innerHTML=`<div class="center box stack"><h2>Cadastro enviado</h2><p>Olá, ${esc(eu.nome)}. Seu cadastro foi recebido e está aguardando o administrador liberar o acesso.</p><button class="btn" id="recheck">Verificar de novo</button></div>`;$('recheck').onclick=carregar;return}
  $('nav').hidden=false;$('sair').hidden=false;$('who').textContent=eu.nome+' · '+(eu.admin&&eu.cargo!=='Supervisor'?'Admin':eu.cargo);
  const pend=Object.values(perfis).filter(p=>!p.aprovado&&!p.admin).length;
  $('badge').hidden=!(eu.admin&&pend);$('badge').textContent=pend;
  document.querySelector('[data-tab=resumo]').hidden=!pode('resumo');document.querySelector('[data-tab=equipe]').hidden=!eu.admin;
  $('nav').style.gridTemplateColumns=`repeat(${document.querySelectorAll('nav button:not([hidden])').length},1fr)`;
  if((ui.tab==='resumo'&&!pode('resumo'))||(ui.tab==='equipe'&&!eu.admin))ui.tab='lista';
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===ui.tab&&!ui.det)));
  if(ui.det){v.innerHTML=detHTML();bindDet()}
  else if(ui.tab==='lista'){v.innerHTML=listaHTML();bindLista()}
  else if(ui.tab==='nova'){v.innerHTML=formHTML();bindForm()}
  else if(ui.tab==='resumo'){v.innerHTML=resumoHTML();bindCards();bindResumo()}
  else{v.innerHTML=equipeHTML();bindEquipe()}
  pedirUrls();
}

/* ---------- Fotos e vídeos (links temporários) ---------- */
function src(path){return urls[path]?.url||''}
function pedirUrls(){
  const falta=[...document.querySelectorAll('[data-path]')].map(e=>e.dataset.path).filter(p=>p&&!(urls[p]&&urls[p].ate>Date.now())&&!pedindo.has(p));
  [...document.querySelectorAll('[data-path]')].forEach(e=>{if(urls[e.dataset.path])e.src=urls[e.dataset.path].url});
  if(!falta.length)return;falta.forEach(p=>pedindo.add(p));
  sb.storage.from(BUCKET).createSignedUrls(falta,3600).then(({data})=>{(data||[]).forEach(d=>{if(d.signedUrl)urls[d.path]={url:d.signedUrl,ate:Date.now()+50*60e3}});
    falta.forEach(p=>pedindo.delete(p));document.querySelectorAll('[data-path]').forEach(e=>{if(urls[e.dataset.path]&&!e.src)e.src=urls[e.dataset.path].url})});
}

const dia=t=>new Date(t).toLocaleDateString('sv-SE');
const hoje=()=>dia(Date.now()),diasAtras=n=>dia(Date.now()-n*864e5);
function filtrar(){const q=ui.busca.trim().toLowerCase();
  return ocs.filter(o=>{
    if(ui.cat&&(o.categoria||'Relatório')!==ui.cat)return false;
    if(ui.cat==='Garantia'&&ui.gst&&(o.gar_status||'Pendente')!==ui.gst)return false;

    const d=dia(o.criado);if(ui.de&&d<ui.de)return false;if(ui.ate&&d>ui.ate)return false;

  .sort((a,b)=>ts(b.criado)-ts(a.criado))}

function bindLista(){const b=$('busca');b.addEventListener('input',e=>{ui.busca=e.target.value;const p=b.selectionStart;render();const n=$('busca');n.focus();n.setSelectionRange(p,p)});
  $('ftipo').addEventListener('change',e=>{ui.tipo=e.target.value;render()});

/* ---------- Exportar Excel ---------- */
function carregarXlsx(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function exportarExcel(lista){
  const b=$('exportar');if(b){b.disabled=true;b.textContent='Gerando…'}
  try{await carregarXlsx()}catch(e){toast('Não foi possível carregar o gerador de Excel. Verifique a internet.');if(b){b.disabled=false;b.textContent='⬇ Exportar Excel'}return}
  const enviadoEm=o=>{const h=[...(o.hist||[])].reverse().find(x=>/^Enviado ao fornecedor/.test(x.txt||''));return h?fData(h.t):''};
  const linhas=lista.map(o=>{const d=new Date(o.criado);return{
    'Data':d.toLocaleDateString('pt-BR'),'Hora':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    'Categoria':o.categoria||'Relatório','Tipo':o.tipo||'','Origem da quebra':o.origem||'',
    'Situação da garantia':o.categoria==='Garantia'?(o.gar_status||'Pendente'):'','Enviado ao fornecedor em':o.categoria==='Garantia'?enviadoEm(o):'',
    'Fornecedor':o.fornecedor||'','ID da quebra':o.id_quebra||'','Código da peça':o.sku||'','Peça':o.produto||'','Fabricante':o.fab||'',
    'Quantidade':o.qtd??'','Observação':o.obs||'','Registrado por':nome(o.autor),'Fotos':(o.fotos||[]).length,'Vídeos':(o.videos||[]).length}});
  const ws=XLSX.utils.json_to_sheet(linhas);
  const cols=Object.keys(linhas[0]||{Data:''});ws['!cols']=cols.map(c=>({wch:Math.min(45,Math.max(c.length+2,...linhas.map(r=>String(r[c]??'').length+2)))}));
  if(linhas.length)ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:linhas.length,c:cols.length-1}})};
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,ui.cat==='Garantia'?'Garantias':'Relatórios');
  const partes=['inventario',ui.cat==='Garantia'?'garantias':'relatorios'];if(ui.gst)partes.push(ui.gst.split(' ')[0].toLowerCase());
  if(ui.pessoa)partes.push(nome(ui.pessoa).split(' ')[0].toLowerCase());partes.push(ui.de||ui.ate?(ui.de||'inicio')+'_a_'+(ui.ate||hoje()):hoje());
  XLSX.writeFile(wb,partes.join('-').normalize('NFD').replace(/[\u0300-\u036f]/g,'')+'.xlsx');
  toast(lista.length+(lista.length===1?' linha exportada':' linhas exportadas'));if(b){b.disabled=false;b.textContent='⬇ Exportar Excel'}}

function ler(){draft.tipo=(document.querySelector('input[name=tipo]:checked')||{}).value||'';
  ['sku','produto','fab','qtd','obs'].forEach(k=>draft[k]=$(k).value.trim());if($('forn')){draft.forn=$('forn').value.trim();draft.idq=$('idq').value.trim()}}
const caminho=ext=>`${uid}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
async function enviar(blob,ext,tipo){const p=caminho(ext);const {error}=await sb.storage.from(BUCKET).upload(p,blob,{contentType:tipo,upsert:false});if(error)throw error;return p}
function removerArquivos(paths){if(paths.length)sb.storage.from(BUCKET).remove(paths).catch(()=>{})}
function bindForm(){const fm=$('fnova');fm.addEventListener('input',ler);fm.addEventListener('change',ler);
  document.querySelectorAll('[data-ncat]').forEach(b=>b.addEventListener('click',()=>{ler();draft.cat=b.dataset.ncat;if(!(TIPOS_CAT[draft.cat]||[]).includes(draft.tipo))draft.tipo='';if(draft.cat!=='Garantia')draft.origem='';render()}));
  document.querySelectorAll('[data-orig]').forEach(b=>b.addEventListener('click',()=>{ler();draft.origem=b.dataset.orig;render()}));
  const fi=$('foto');if(fi)fi.addEventListener('change',async e=>{ler();const files=[...e.target.files].slice(0,4-draft.fotos.length);const d=draft;
    for(const f of files){enviando++;render();try{const {blob,prev}=await comprimir(f);const path=await enviar(blob,'jpg','image/jpeg');d.fotos.push({path,prev})}catch(x){toast(x&&x.message?erroMsg(x):'Não foi possível ler essa imagem')}enviando--}
    if(draft===d&&ui.tab==='nova')render()});
  const vi=$('video');if(vi)vi.addEventListener('change',async e=>{ler();const f=e.target.files[0];if(!f)return;const d=draft;
    if(f.size>MAX_VIDEO){toast('Vídeo grande demais (máx. 50 MB). Grave um vídeo mais curto.');return}
    const ext=/webm/.test(f.type)?'webm':/quicktime/.test(f.type)?'mov':'mp4';
    enviando++;render();try{const path=await enviar(f,ext,f.type||'video/mp4');d.videos.push({path,prev:URL.createObjectURL(f)})}catch(x){toast(erroMsg(x))}enviando--;
    if(draft===d&&ui.tab==='nova')render()});
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{ler();const [f]=draft.fotos.splice(+b.dataset.rm,1);if(f)removerArquivos([f.path]);render()}));
  document.querySelectorAll('[data-rmv]').forEach(b=>b.addEventListener('click',()=>{ler();const [v]=draft.videos.splice(+b.dataset.rmv,1);if(v)removerArquivos([v.path]);render()}));
  $('limpar').addEventListener('click',()=>{removerArquivos([...draft.fotos,...draft.videos].map(x=>x.path));draft=novo();render()});
  fm.addEventListener('submit',async e=>{e.preventDefault();if(saving)return;if(enviando){toast('Aguarde as fotos e vídeos terminarem de enviar');return}ler();const er=$('ferr');
    if(!draft.cat||!draft.tipo||(draft.cat==='Garantia'&&!draft.origem)){er.textContent=!draft.cat?'Escolha se é Garantia ou Relatório.':(draft.cat==='Garantia'&&!draft.origem)?'Escolha a origem da quebra.':'Escolha o tipo.';er.hidden=false;return}
    const mid=[draft.fotos.length?draft.fotos.length+' foto(s)':'',draft.videos.length?draft.videos.length+' vídeo(s)':''].filter(Boolean).join(' e ');
    const gar=draft.cat==='Garantia';
    const o={categoria:draft.cat,fornecedor:gar&&draft.forn||null,id_quebra:gar&&draft.idq||null,gar_status:gar?'Pendente':null,origem:gar?draft.origem:null,tipo:draft.tipo,endereco:'',sku:draft.sku||null,produto:draft.produto||null,fab:draft.fab||null,qtd:draft.qtd?+draft.qtd:null,obs:draft.obs||null,
      fotos:draft.fotos.map(f=>f.path),videos:draft.videos.map(v=>v.path),autor:uid,status:'registrada',hist:[{t:new Date().toISOString(),por:uid,txt:'Registrada'+(mid?' com '+mid:'')}]};
    saving=true;const {error}=await sb.from('ocorrencias').insert(o);saving=false;
    if(error){er.textContent=erroMsg(error);er.hidden=false;return}
    draft.fotos.forEach(f=>{urls[f.path]={url:f.prev,ate:Date.now()+50*60e3}});
    const msgOk=draft.cat==='Garantia'?'Garantia registrada':'Relatório registrado';draft=null;toast(msgOk);go('lista')})}
function comprimir(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
  const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
  const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,c.height-28,c.width,28);x.fillStyle='#fff';x.font='16px monospace';x.fillText(fData(Date.now()),10,c.height-9);
  const prev=c.toDataURL('image/jpeg',0.7);c.toBlob(b=>b?res({blob:b,prev}):rej(new Error('imagem')),'image/jpeg',0.7)};img.src=r.result};r.readAsDataURL(file)})}

const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_L=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const mesKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mesCurto=k=>{const [y,m]=k.split('-');return MESES[+m-1]+'/'+y.slice(2)};
const mesLongo=k=>{const [y,m]=k.split('-');return MESES_L[+m-1]+' de '+y};
function ultimosMeses(n){const d=new Date(),r=[];for(let i=n-1;i>=0;i--)r.push(mesKey(new Date(d.getFullYear(),d.getMonth()-i,1)));return r}
function mensalHTML(){
  const atual=mesKey(Date.now());if(!ui.mes)ui.mes=atual;
  const conta=k=>{const r={g:0,r:0,gp:0};ocs.forEach(o=>{if(mesKey(o.criado)!==k)return;if(o.categoria==='Garantia'){r.g++;if((o.gar_status||'Pendente')==='Pendente')r.gp++}else r.r++});return r};
  const meses=ultimosMeses(6),dados=meses.map(k=>({k,...conta(k)}));
  const todos=[...new Set([atual,...ocs.map(o=>mesKey(o.criado))])].sort().reverse();
  const sel=conta(ui.mes);
  const mx=Math.max(1,...dados.map(d=>Math.max(d.g,d.r)));const passo=mx<=5?1:mx<=10?2:mx<=25?5:mx<=50?10:Math.ceil(mx/50)*10;const top=Math.ceil(mx/passo)*passo;
  const W=innerWidth<520?360:600,H=innerWidth<520?220:230,L=28,R=6,T=18,B=34,ph=H-T-B,gw=(W-L-R)/dados.length,bw=Math.min(30,gw*0.3);
  const y=v=>T+ph-(v/top)*ph;
  let svg='';for(let v=0;v<=top;v+=passo){svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`}
  dados.forEach((d,i)=>{const cx=L+gw*i+gw/2,on=d.k===ui.mes;
    svg+=`<g class="mg" data-mes="${d.k}" role="button" tabindex="0" aria-label="${mesLongo(d.k)}: ${d.g} garantias, ${d.r} relatórios">`;
    svg+=`<rect x="${L+gw*i+2}" y="${T}" width="${gw-4}" height="${ph+B-4}" rx="6" class="${on?'sel':'hit'}"/>`;
    [[d.g,'bg',-bw-2],[d.r,'br',2]].forEach(([v,c,dx])=>{const h=(v/top)*ph;svg+=`<rect x="${cx+dx}" y="${y(v)}" width="${bw}" height="${Math.max(h,v?2:0)}" rx="3" class="${c}"/>`;if(v)svg+=`<text x="${cx+dx+bw/2}" y="${y(v)-5}" text-anchor="middle" class="vl">${v}</text>`});
    svg+=`<text x="${cx}" y="${H-12}" text-anchor="middle" class="ax${on?' on':''}">${mesCurto(d.k)}</text></g>`});
  return`<span class="lbl">Garantias e relatórios por mês</span>
  <div class="box stack" style="gap:12px">
   <div class="mesrow"><select id="fmes" aria-label="Mês">${todos.map(k=>`<option value="${k}" ${k===ui.mes?'selected':''}>${mesLongo(k)}</option>`).join('')}</select></div>
   <div class="mesnum"><div><span class="dot bg"></span><b>${sel.g}</b> ${sel.g===1?'garantia':'garantias'}${sel.g?`<div class="muted small">${sel.gp} pendente${sel.gp===1?'':'s'} · ${sel.g-sel.gp} enviada${sel.g-sel.gp===1?'':'s'}</div>`:''}</div><div><span class="dot br"></span><b>${sel.r}</b> ${sel.r===1?'relatório':'relatórios'}</div><div><b>${sel.g+sel.r}</b> no total</div></div>
   <div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" class="mchart" role="img" aria-label="Gráfico dos últimos 6 meses">${svg}</svg></div>
   <div class="legend"><span><span class="dot bg"></span>Garantia</span><span><span class="dot br"></span>Relatório</span><span class="muted">Toque num mês para ver os números</span></div>
  </div>`}
function bindResumo(){const s=$('fmes');if(s)s.onchange=()=>{ui.mes=s.value;render()};
  document.querySelectorAll('.mg').forEach(g=>{const f=()=>{ui.mes=g.dataset.mes;render()};g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})})}

    <span class="lbl">Garantias por fornecedor</span><div class="box stack" style="gap:8px">${bars(Object.entries(pf).sort((a,b)=>b[1]-a[1]).slice(0,8))}</div>`})()}

function telaConfig(){
  $('view').innerHTML=`<div class="stack">
  <div class="box stack"><div><h2>Configuração inicial</h2><p class="muted small" style="margin:0">Feita uma única vez pelo administrador. Leva uns 10 minutos.</p></div>
  <ol class="steps">
   <li>Crie uma conta gratuita em <b>supabase.com</b> e clique em <b>New project</b>. Dê o nome <code>inventario-cd</code>, crie uma senha para o banco (guarde-a) e escolha a região <b>South America (São Paulo)</b>.</li>
   <li>Quando o projeto terminar de criar, abra <b>SQL Editor</b> no menu da esquerda, clique em <b>New query</b>, cole o código copiado pelo botão abaixo e clique em <b>Run</b>. Deve aparecer "Success".<div style="margin-top:8px"><button class="btn sm" id="copiarSql">Copiar código do banco</button> <span class="ok small" id="sqlOk" hidden>Copiado</span></div><textarea id="sqlBox" readonly hidden style="margin-top:8px;min-height:140px;font-family:var(--mono);font-size:.75rem"></textarea></li>
   <li>Em <b>Authentication</b> → <b>Sign In / Providers</b> → <b>Email</b>, desligue <b>Confirm email</b> e salve. Assim a equipe entra logo após o cadastro, sem precisar abrir o e-mail. Se preferir manter a confirmação, cada pessoa recebe um e-mail ao se cadastrar.</li>
   <li>Em <b>Project Settings</b> → <b>API Keys</b>, copie a chave <b>anon public</b> (aba Legacy) ou a <b>Publishable key</b>. Em <b>Project Settings</b> → <b>Data API</b>, copie a <b>Project URL</b>. Cole as duas abaixo.</li>
  </ol></div>
  <form class="box stack" id="fcfg" novalidate>
   <div class="field"><label class="lbl" for="cfgUrl">Project URL</label><input id="cfgUrl" class="mono" placeholder="https://xxxx.supabase.co"></div>
   <div class="field"><label class="lbl" for="cfgKey">Chave anon public / Publishable key</label><input id="cfgKey" class="mono" placeholder="eyJ... ou sb_publishable_..."></div>
   <div id="cfgMsg" hidden></div>
   <button class="btn primary" type="submit">Testar conexão</button>
   <button class="btn" type="button" id="baixar" disabled>Baixar arquivo configurado</button>
   <button class="btn" type="button" id="baixarCfg" disabled>Baixar config.js (para site no GitHub)</button>
   <p class="muted small" style="margin:0">O arquivo baixado já vem com a conexão pronta. Use esse arquivo daqui em diante e copie-o para os outros computadores. <b>A primeira pessoa que se cadastrar vira administrador</b>, então faça o seu cadastro primeiro.</p>
  </form></div>`;
  $('copiarSql').onclick=()=>{const t=$('sql').textContent.trim();const box=$('sqlBox');
    const fb=()=>{box.value=t;box.hidden=false;box.select();toast('Selecione o texto e copie com Ctrl+C')};
    try{navigator.clipboard.writeText(t).then(()=>{$('sqlOk').hidden=false},fb)}catch(e){fb()}};
  let cfg=null;
  if(window.top!==window){$('view').insertAdjacentHTML('afterbegin','<div class="box err" style="margin-bottom:14px">Este arquivo está aberto dentro de outro aplicativo, e assim a conexão não funciona. Baixe o arquivo inventario-cd.html, abra a pasta Downloads e dê dois cliques nele para abrir no Chrome ou no Edge.</div>')}
  $('fcfg').addEventListener('submit',async e=>{e.preventDefault();const m=$('cfgMsg'),btn=e.target.querySelector('[type=submit]');
    let url=$('cfgUrl').value.trim().replace(/\s/g,''),key=$('cfgKey').value.trim().replace(/\s/g,'');
    const ref=url.match(/project\/([a-z0-9]{10,})/i);if(ref)url='https://'+ref[1]+'.supabase.co';
    if(url&&!/^https?:\/\//.test(url))url='https://'+url;
    url=url.replace(/\/(rest|auth)\/v1.*$/,'').replace(/\/+$/,'');$('cfgUrl').value=url;$('cfgKey').value=key;
    const show=(ok,t)=>{m.className=ok?'ok':'err';m.textContent=t;m.hidden=false;m.scrollIntoView({block:'center',behavior:'smooth'})};
    if(!/^https:\/\/[^/]+\.[a-z]+/.test(url)){show(false,'A Project URL parece errada. Ela tem o formato https://xxxx.supabase.co e fica em Project Settings → Data API.');return}
    if(key.length<20){show(false,'A chave parece incompleta. Copie a chave inteira (anon public, que começa com eyJ, ou a Publishable key, que começa com sb_publishable_).');return}
    if(/^sb_secret_/.test(key)||/service_role/.test(atobSeguro(key))){show(false,'Essa é a chave secreta (service_role / secret). Use a chave anon public ou a Publishable key.');return}
    show(true,'Testando…');btn.disabled=true;
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
    try{const h={apikey:key};if(/^eyJ/.test(key))h.Authorization='Bearer '+key;
      const r=await fetch(url+'/rest/v1/ocorrencias?select=id&limit=1',{headers:h,signal:ctl.signal});
      let corpo='';try{corpo=await r.text()}catch(x){}
      if(r.ok){cfg={url,key};$('baixar').disabled=false;$('baixarCfg').disabled=false;
        show(true,window.supabase?'Conexão funcionando. Agora clique em Baixar arquivo configurado.':'O banco respondeu, mas este computador não carregou um componente do app (cdn.jsdelivr.net). Baixe o arquivo configurado e teste; se não abrir, a rede da empresa pode estar bloqueando esse endereço.')}
      else if(r.status===401||r.status===403||/Invalid API key|No API key/i.test(corpo))show(false,'O servidor recusou a chave (erro '+r.status+'). Copie de novo a chave anon public ou a Publishable key, inteira.');
      else if(r.status===404||/PGRST205|42P01|does not exist|schema cache/i.test(corpo))show(false,'Conectou, mas o banco não está pronto. Refaça o passo 2: cole o código do banco no SQL Editor e clique em Run.');
      else show(false,'O servidor respondeu com erro '+r.status+'. '+corpo.slice(0,160))}
    catch(x){show(false,x.name==='AbortError'?'O servidor não respondeu em 15 segundos. Confira a Project URL. Se estiver certa, a rede da empresa pode estar bloqueando o endereço supabase.co.':'Não foi possível chegar ao servidor. Confira a Project URL. Se estiver certa, a rede da empresa pode estar bloqueando o endereço supabase.co (teste em outra rede, como o 4G do celular).')}
    clearTimeout(timer);btn.disabled=false});
  const baixa=(nomeArq,txt,tipo)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nomeArq;document.body.appendChild(a);a.click();a.remove()};
  $('baixarCfg').onclick=()=>{if(!cfg)return;baixa('config.js','window.INV_CONFIG='+JSON.stringify(cfg)+';\n','text/javascript');toast('config.js baixado. Envie para o repositório junto com o index.html.')};
  $('baixar').onclick=()=>{if(!cfg)return;
    const html=ORIGINAL.replace("const SUPABASE_URL='';const SUPABASE_KEY='';",`const SUPABASE_URL=${JSON.stringify(cfg.url)};const SUPABASE_KEY=${JSON.stringify(cfg.key)};`);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='inventario-cd.html';document.body.appendChild(a);a.click();a.remove();
    toast('Arquivo baixado. Abra o inventario-cd.html da pasta Downloads.')};
}

init();
</script>
</body>
</html>
