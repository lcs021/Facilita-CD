<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>try{var tm=localStorage.getItem("inv_tema");if(tm==="light"||tm==="dark")document.documentElement.dataset.theme=tm}catch(e){}</script>
<title>Facilita CD</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: barra superior escura, conteúdo em coluna de 680px, navegação inferior com botão central de registrar */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --sunken:#eef1f6; --line:#e3e7ee; --line2:#d3d9e3;
  --fg:#111827; --muted:#667085; --ink:#0e1525; --ink-fg:#f5f7fb;
  --accent:#2457d6; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --gar:#e2621b; --gar-soft:#fdeee4; --gar-ink:#9a3b07;
  --min:#15803d; --min-soft:#e3f6e9; --min-ink:#14532d;
  --bai:#7c3aed; --bai-soft:#f1eafe; --bai-ink:#4c1d95;
  --alta:#d43d30; --baixa:#1f8a4c;
  --sh1:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --sh2:0 4px 16px rgba(16,24,40,.08),0 1px 3px rgba(16,24,40,.06);
  --r:14px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c111b; --surface:#151c29; --sunken:#1c2534; --line:#253045; --line2:#334058;
  --fg:#e9edf5; --muted:#94a0b4; --ink:#070b13; --ink-fg:#f5f7fb;
  --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1a2747;
  --gar:#ff8a45; --gar-soft:#3a2216; --gar-ink:#ffc39d;
  --min:#4ade80; --min-soft:#13301f; --min-ink:#a7f3c0;
  --bai:#b794ff; --bai-soft:#2a1f45; --bai-ink:#ddd0ff;
  --alta:#ff6b5e; --baixa:#4cc785;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c111b; --surface:#151c29; --sunken:#1c2534; --line:#253045; --line2:#334058;
  --fg:#e9edf5; --muted:#94a0b4; --ink:#070b13; --ink-fg:#f5f7fb;
  --accent:#6f9bff; --accent-ink:#0b1220; --accent-soft:#1a2747;
  --gar:#ff8a45; --gar-soft:#3a2216; --gar-ink:#ffc39d;
  --min:#4ade80; --min-soft:#13301f; --min-ink:#a7f3c0;
  --bai:#b794ff; --bai-soft:#2a1f45; --bai-ink:#ddd0ff;
  --alta:#ff6b5e; --baixa:#4cc785;
  --sh1:0 1px 2px rgba(0,0,0,.3); --sh2:0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}

/* Topo */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--ink-fg);padding-top:env(safe-area-inset-top,0px)}
.topin{max-width:680px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff8a45,#e2621b);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px rgba(226,98,27,.35)}
.logo svg{width:20px;height:20px;color:#fff}
h1{font-size:1.08rem;margin:0;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.hdr{display:flex;align-items:center;gap:10px;min-width:0}
.who{font-size:.82rem;color:#b8c2d6;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
#sair{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--ink-fg);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.84rem;cursor:pointer}
#sair:hover{background:rgba(255,255,255,.16)}
body.auth .topbar{display:none}
.rodape{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 8px;margin:34px auto 0;padding:16px 12px 6px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;text-align:center}
.rodape b{color:var(--fg);font-weight:700}
.rodape .rd-sep{opacity:.5}
.rodape .rd-logo{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:linear-gradient(135deg,#ff8a45,#e2621b);color:#fff}
.rodape .rd-logo svg{width:12px;height:12px}
.rodape-auth{border-top:0;margin-top:18px;padding-top:4px}
body.auth #rodape{display:none}
@media print{.rodape{display:none!important}}
.temabtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--ink-fg);cursor:pointer;flex:none;transition:background .15s,transform .2s}
.temabtn:hover{background:rgba(255,255,255,.16)}.temabtn:active{transform:rotate(-20deg)}.temabtn svg{width:18px;height:18px}
.temaflut{position:fixed;top:14px;right:14px;z-index:40;background:var(--surface);border:1px solid var(--line);color:var(--fg);box-shadow:var(--sh1)}
.temaflut:hover{background:var(--sunken)}
.aparencia{margin:10px 12px 4px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--sunken)}
.aparencia .lb{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px;display:block}
.aparencia .op{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border-radius:11px;padding:3px;border:1px solid var(--line)}
.aparencia button{border:0;background:none;color:var(--muted);font:700 .78rem var(--font);padding:7px 4px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.aparencia button svg{width:16px;height:16px}
.aparencia button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.homebtn{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:inherit;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:12px;cursor:pointer;min-width:0;transition:background .15s}
.homebtn:hover{background:rgba(255,255,255,.08)}.homebtn:active{transform:translateY(1px)}

.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px}
h2{font-size:1.3rem;margin:0 0 4px;font-weight:800;letter-spacing:-.015em;text-wrap:balance}
h3{font-size:1rem;margin:0}
.muted{color:var(--muted)} .small{font-size:.84rem}
.mono{font-family:var(--mono)}
.lbl{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* Navegação inferior */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));max-width:100%}
nav button{background:none;border:0;color:var(--muted);font:600 .74rem var(--font);padding:6px 2px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button svg{width:23px;height:23px}
nav button[aria-current="true"]{color:var(--accent)}
nav button[aria-current="true"] .ic{background:var(--accent-soft)}
nav .ic{display:grid;place-items:center;width:46px;height:30px;border-radius:999px;transition:background .15s}
nav button[data-tab="nova"] .ic{width:48px;height:48px;margin-top:-22px;background:linear-gradient(135deg,#ff8a45,#e2621b);color:#fff;border-radius:16px;box-shadow:0 6px 16px rgba(226,98,27,.38)}
nav button[data-tab="nova"][aria-current="true"] .ic{background:linear-gradient(135deg,#ff8a45,#e2621b);outline:3px solid var(--gar-soft)}
nav button[data-tab="nova"]{color:var(--fg)}
nav .badge{position:absolute;top:0;left:calc(50% + 8px);background:var(--alta);color:#fff;border-radius:999px;font-size:.66rem;font-weight:800;padding:1px 6px;border:2px solid var(--surface)}

/* Formulários */
input,select,textarea{font-size:.97rem;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:#9aa4b5}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:700 .97rem var(--font);border-radius:12px;padding:12px 18px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;transition:transform .05s,box-shadow .15s,background .15s}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 30%,transparent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{font-size:.84rem;padding:8px 13px;border-radius:10px}
.btn.danger{color:var(--alta)}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 4px;font-size:.92rem;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.stack{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh1)}
.center{max-width:440px;margin:12px auto 0}
.err{color:var(--alta);font-size:.88rem;font-weight:600;background:color-mix(in srgb,var(--alta) 9%,transparent);padding:9px 12px;border-radius:10px}
.ok{color:var(--baixa);font-size:.88rem;font-weight:600;background:color-mix(in srgb,var(--baixa) 10%,transparent);padding:9px 12px;border-radius:10px}

/* Telas de acesso */
body.auth{background:var(--bg)}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin:36px auto 22px}
.hero .logo{width:62px;height:62px;border-radius:18px}
.hero .logo svg{width:34px;height:34px}
.hero h1{font-size:1.6rem;white-space:normal}
.hero p{margin:0;color:var(--muted)}
.authshell{position:fixed;inset:0;z-index:30;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  background:radial-gradient(600px 320px at 50% 0%,var(--gar-soft),transparent 70%),var(--bg)}
.acard{width:100%;max-width:400px;margin:auto;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.acard.shake{animation:shake .4s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.alogo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:22px;text-align:center}
.alogo .logo{width:56px;height:56px;border-radius:17px}
.alogo .logo svg{width:30px;height:30px}
.alogo h1{font-size:1.5rem;letter-spacing:-.02em;white-space:normal}
.alogo p{margin:0;color:var(--muted);font-size:.95rem}
.apanel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px 24px;box-shadow:var(--sh2)}
.apanel form{gap:16px}
.inp{position:relative}
.inp>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none;transition:color .15s}
.inp input{padding:13px 14px 13px 43px;border-radius:12px}
.inp.pw input{padding-right:46px}
.inp:focus-within>svg{color:var(--accent)}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;color:var(--muted);border-radius:10px;cursor:pointer;display:grid;place-items:center}
.eye:hover{background:var(--sunken);color:var(--fg)}
.eye svg{width:18px;height:18px}
.caps{display:flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;color:var(--gar-ink);background:var(--gar-soft);padding:6px 10px;border-radius:9px;width:fit-content}
.caps svg{width:14px;height:14px}
.lembrar{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--muted);cursor:pointer;user-select:none}
.lembrar input{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
.btn.go{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 18px;border-radius:12px;font-size:1rem}
.btn.go svg{width:18px;height:18px;transition:transform .2s}
.btn.go:hover svg{transform:translateX(3px)}
.btn.go.busy{pointer-events:none;opacity:.85}
.btn.go.busy svg{display:none}
.btn.go.busy::before{content:"";width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.atroca{text-align:center;margin:20px 0 0;font-size:.92rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.acard{animation:none!important}}

/* Lista */
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters>*{flex:1 1 160px;min-width:0}
.seg{display:flex;gap:4px;background:var(--sunken);border-radius:13px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:10px 6px;font:700 .92rem var(--font);color:var(--muted);cursor:pointer;border-radius:10px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--sh1)}
.seg button[data-cat="Garantia"][aria-pressed="true"]{color:var(--gar)}
.seg button[data-cat="Relatório"][aria-pressed="true"]{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:10px;width:100%;box-shadow:var(--sh1);transition:box-shadow .15s,transform .1s,border-color .15s}
.card:hover{box-shadow:var(--sh2);border-color:var(--line2)}
.card:active{transform:scale(.995)}
.thumb{background:var(--sunken);position:relative;min-height:76px;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:.68rem;font-weight:600;text-align:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .b{min-width:0;display:flex;flex-direction:column;gap:3px;padding-block:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t{font-weight:800;letter-spacing:-.01em}
.line{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addr{font-family:var(--mono);font-size:.78rem;background:var(--sunken);padding:1px 6px;border-radius:5px}
.empty{text-align:center;color:var(--muted);padding:44px 16px;border:1.5px dashed var(--line2);border-radius:var(--r);background:var(--surface)}

/* Registrar */
.radios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.radios label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:.92rem;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s}
.radios label:hover{border-color:var(--line2)}
.radios input{width:18px;height:18px;accent-color:var(--accent);margin:0;flex:none;box-shadow:none}
.radios label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.addbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;border:1.5px dashed var(--line2);border-radius:12px;background:var(--surface);padding:16px 8px;font-weight:700;font-size:.94rem;cursor:pointer;text-align:center;transition:border-color .15s,background .15s}
.addbtn:hover{border-color:var(--accent);background:var(--accent-soft)}
.addbtn svg{width:22px;height:22px;flex:none;color:var(--accent)}
.addbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.addbtn.off{color:var(--muted);cursor:default;font-weight:600}
.addbtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--sunken);max-width:100%;display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.ph button{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;z-index:2;font-size:1rem}
.vb{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.65);color:#fff;font-size:.66rem;padding:1px 6px;border-radius:5px;z-index:2}
.catpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.catpick button{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px 13px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;font:inherit;box-shadow:var(--sh1);transition:border-color .15s,background .15s}
.catpick button:hover{border-color:var(--line2)}
.catpick button b{font-size:1.02rem;font-weight:800}
.catpick button small{font-size:.78rem;color:var(--muted);line-height:1.35}
.catpick button.gar[aria-pressed="true"]{border-color:var(--gar);background:var(--gar-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--gar) 15%,transparent)}
.catpick button.gar[aria-pressed="true"] b{color:var(--gar)}
.catpick button.rel[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.catpick button.rel[aria-pressed="true"] b{color:var(--accent)}
.catpick.g4o{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.catpick.g4o{grid-template-columns:1fr 1fr}}
.gbox{border-color:color-mix(in srgb,var(--gar) 35%,var(--line));background:linear-gradient(180deg,var(--gar-soft),var(--surface) 60%)}

/* Detalhe */
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
.gallery img{height:230px;max-width:85%;border-radius:14px;object-fit:cover;flex:none;background:var(--sunken);scroll-snap-align:start}
.vplay{width:100%;max-height:380px;border-radius:14px;background:#000}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;margin:0}
dl.facts dt{color:var(--muted);font-size:.86rem}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere;font-weight:600}
ul.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ul.hist li{font-size:.9rem;border-left:2px solid var(--line2);padding-left:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap} .actions .btn{flex:1 1 auto}

/* Resumo */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh1);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.85}
.stats.g4 .stat:first-child::before{background:#e0a100}
.stats.g4 .stat:last-child::before{background:var(--gar)}
.stat .v{font:800 1.75rem var(--mono);letter-spacing:-.02em;line-height:1.15}
.stats.g4{grid-template-columns:repeat(2,1fr)}
.bar{display:grid;grid-template-columns:minmax(0,10rem) 1fr 2.2rem;gap:12px;align-items:center;font-size:.88rem;font-weight:600}
.bar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:10px;background:var(--sunken);border-radius:999px;overflow:hidden}

<script type="text/plain" id="sql">-- Inventário CD: estrutura do banco (rode uma vez no SQL Editor do Supabase)

-- Tabelas
create table if not exists public.perfis (
  id uuid primary key references auth.users(id) on delete cascade,
  nome text not null default '',
  email text,
  cargo text not null default 'Auxiliar de Inventário',
  aprovado boolean not null default false,
  admin boolean not null default false,
  criado timestamptz not null default now()
);
alter table public.perfis add column if not exists recusado boolean not null default false;
alter table public.perfis add column if not exists usuario text;
create unique index if not exists perfis_usuario_unico on public.perfis (lower(usuario));

create table if not exists public.ocorrencias (
  id uuid primary key default gen_random_uuid(),
  tipo text not null,
  endereco text not null,
  sku text,
  produto text,
  fab text,
  qtd integer,
  obs text,
  fotos text[] not null default '{}',
  videos text[] not null default '{}',
  autor uuid references public.perfis(id) on delete set null,
  status text not null default 'aberta',
  hist jsonb not null default '[]'::jsonb,
  criado timestamptz not null default now()
);

-- Categoria do registro (Garantia ou Relatório)
alter table public.ocorrencias add column if not exists categoria text not null default 'Relatório';
alter table public.ocorrencias add column if not exists fornecedor text;
alter table public.ocorrencias add column if not exists id_quebra text;
alter table public.ocorrencias add column if not exists gar_status text;
alter table public.ocorrencias add column if not exists origem text;

alter table public.perfis enable row level security;
alter table public.ocorrencias enable row level security;

-- Funções de permissão
create or replace function public.is_aprovado() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select aprovado or admin from public.perfis where id = auth.uid()), false)
$$;

create or replace function public.is_admin() returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select admin from public.perfis where id = auth.uid()), false)
$$;

create or replace function public.tem_cargo(cargos text[]) returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((select admin or (aprovado and cargo = any(cargos)) from public.perfis where id = auth.uid()), false)
$$;


-- Permissões por cargo (o Chefe de Inventário pode tudo; o Auxiliar pode o que o administrador liberar)
create table if not exists public.cargos (
  nome text primary key,
  perms text[] not null default '{}'
);
alter table public.cargos enable row level security;
drop policy if exists "ver cargos" on public.cargos;
create policy "ver cargos" on public.cargos for select to authenticated using (true);
drop policy if exists "admin edita cargos" on public.cargos;
create policy "admin edita cargos" on public.cargos for all to authenticated using (public.is_admin()) with check (public.is_admin());
insert into public.cargos (nome, perms) values
  ('Auxiliar de Inventário', array['mod:Garantia','mod:Relatório','mod:Minucioso','mod:Consertos Baiano','registrar','resumo','garantia'])
on conflict (nome) do nothing;

create or replace function public.tem_perm(p text) returns boolean
language sql stable security definer set search_path = public as $$
  select coalesce((
    select pf.admin or (pf.aprovado and (pf.cargo = 'Chefe de Inventário'
      or exists (select 1 from public.cargos c where c.nome = pf.cargo and p = any(c.perms))))
    from public.perfis pf where pf.id = auth.uid()), false)
$$;

-- Ao criar uma conta, cria o perfil. A primeira conta vira administrador.
create or replace function public.novo_usuario() returns trigger
language plpgsql security definer set search_path = public as $$
declare primeiro boolean;
begin
  select not exists (select 1 from public.perfis) into primeiro;
  insert into public.perfis (id, nome, email, cargo, aprovado, admin, usuario)
  values (new.id, coalesce(new.raw_user_meta_data->>'nome', ''), new.email,
          case when primeiro then 'Chefe de Inventário' else 'Auxiliar de Inventário' end, primeiro, primeiro,
          nullif(regexp_replace(trim(coalesce(new.raw_user_meta_data->>'usuario', '')), '\s+', ' ', 'g'), ''));
  return new;
end
$$;

drop trigger if exists ao_criar_usuario on auth.users;
create trigger ao_criar_usuario after insert on auth.users
  for each row execute function public.novo_usuario();

-- Regras de acesso: perfis
drop policy if exists "ver perfis" on public.perfis;
create policy "ver perfis" on public.perfis for select to authenticated
  using (id = auth.uid() or public.is_aprovado());
drop policy if exists "admin altera perfis" on public.perfis;
create policy "admin altera perfis" on public.perfis for update to authenticated
  using (public.is_admin()) with check (public.is_admin());

-- Regras de acesso: ocorrências
drop policy if exists "ver ocorrencias" on public.ocorrencias;

-- Excluir usuário não liberado (somente administrador)
create or replace function public.excluir_usuario(alvo uuid) returns void
language plpgsql security definer set search_path = public as $$
begin
  if not public.is_admin() then raise exception 'Apenas o administrador pode excluir usuários'; end if;
  if alvo = auth.uid() then raise exception 'Você não pode excluir a si mesmo'; end if;
  if exists (select 1 from public.perfis where id = alvo and (admin or aprovado)) then
    raise exception 'Só é possível excluir usuários não liberados';
  end if;
  delete from auth.users where id = alvo;
end
$$;
revoke all on function public.excluir_usuario(uuid) from public, anon;
grant execute on function public.excluir_usuario(uuid) to authenticated;

-- Login por usuário: descobre o e-mail a partir do nome de usuário
create or replace function public.email_do_usuario(u text) returns text
language sql stable security definer set search_path = public as $$
  select email from public.perfis
  where lower(usuario) = lower(regexp_replace(trim(u), '\s+', ' ', 'g'))
  limit 1
$$;
grant execute on function public.email_do_usuario(text) to anon, authenticated;

-- Usuário do administrador (mesma senha de antes)
update public.perfis set usuario = 'Lucas Carvalho'
where id = (select id from public.perfis where admin order by criado limit 1)
  and not exists (select 1 from public.perfis where lower(usuario) = 'lucas carvalho');

-- Cadastro sem e-mail: gera um endereço interno (caixa do administrador com +código)
create or replace function public.email_novo_usuario(u text) returns text
language sql stable security definer set search_path = public, auth as $$
  select split_part(x.e, '@', 1) || '+u' || substr(md5(lower(regexp_replace(trim(u), '\s+', ' ', 'g'))), 1, 10) || '@' || split_part(x.e, '@', 2)
  from (
    select coalesce(nullif(p.email, ''), au.email) as e, p.criado
    from public.perfis p join auth.users au on au.id = p.id
    where p.admin
    order by p.criado
    limit 1
  ) x
  where x.e like '%@%'
$$;
grant execute on function public.email_novo_usuario(text) to anon, authenticated;

-- Administrador redefine a senha de um usuário (a senha antiga não é visível; fica guardada só em forma criptografada)
create extension if not exists pgcrypto with schema extensions;
create or replace function public.admin_redefinir_senha(alvo uuid, nova text) returns void
language plpgsql security definer set search_path = public, extensions, auth as $$
begin
  if not public.is_admin() then raise exception 'Apenas o administrador pode redefinir senhas'; end if;
  if length(coalesce(nova, '')) < 6 then raise exception 'A senha precisa ter pelo menos 6 caracteres'; end if;
  update auth.users set encrypted_password = extensions.crypt(nova, extensions.gen_salt('bf')), updated_at = now() where id = alvo;
  if not found then raise exception 'Usuário não encontrado'; end if;
end
$$;
revoke all on function public.admin_redefinir_senha(uuid, text) from public, anon;
grant execute on function public.admin_redefinir_senha(uuid, text) to authenticated;

function erroMsg(e){const m=(e&&(e.message||e.error_description))||'';
  if(/categoria|fornecedor|id_quebra|gar_status|origem|recusado|setor|chefe|qtd_sistema|qtd_contada|custo|falta|motivo/i.test(m))return'O banco precisa de uma atualização (coluna categoria). Peça ao administrador para rodar o comando de atualização no SQL Editor do Supabase.';
  if(/Invalid login credentials/i.test(m))return'Usuário ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return'Confirme seu e-mail antes de entrar. Veja a mensagem que chegou na sua caixa de entrada.';
  if(/already registered|already been registered/i.test(m))return'Este e-mail já tem cadastro. Use a tela Entrar.';
  if(/Password should be/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';
  if(/row-level security|permission|not authorized|violates/i.test(m))return'Sem permissão para isso. Fale com o administrador.';
  if(/Failed to fetch|NetworkError|network/i.test(m))return'Sem conexão com o servidor. Verifique a internet.';
  if(/exceeded the maximum allowed size|Payload too large/i.test(m))return'Arquivo grande demais.';
  return m?'Erro: '+m:'Algo deu errado. Tente de novo.'}

/* ---------- Início ---------- */
async function init(){
  const CFG=window.INV_CONFIG||{},URL_=SUPABASE_URL||CFG.url,KEY_=SUPABASE_KEY||CFG.key;
  if(!URL_||!KEY_){telaConfig();return}
  if(!window.supabase){$('view').innerHTML='<div class="center box stack"><h2>Sem conexão</h2><p>Não foi possível carregar o app. Verifique se este computador tem acesso à internet e abra o arquivo de novo.</p></div>';return}
  sb=window.supabase.createClient(URL_,KEY_);
  sb.auth.onAuthStateChange((ev,s)=>{const novo=s?.user?.id||null;if(novo!==uid){uid=novo;setTimeout(entrouOuSaiu,0)}});
  const {data}=await sb.auth.getSession();uid=data.session?.user?.id||null;entrouOuSaiu();
  setInterval(()=>{if(eu&&(eu.aprovado||eu.admin)&&!document.hidden&&!ui.det&&ui.tab!=='nova')carregar()},30000);
}
async function entrouOuSaiu(){
  if(!uid){eu=null;perfis={};ocs=[];carregou=false;render();return}
  await carregarPerfil();await carregar();
}
async function carregarPerfil(){
  const {data,error}=await sb.from('perfis').select('*').eq('id',uid).maybeSingle();
  if(error){toast(erroMsg(error))}eu=data||null;
}
async function carregar(){
  if(!uid)return;await carregarPerfil();
  if(eu&&(eu.aprovado||eu.admin)){
    const [p,o]=await Promise.all([sb.from('perfis').select('*').order('criado',{ascending:false}),sb.from('ocorrencias').select('*').order('criado',{ascending:false}).limit(500)]);

    if(o.error)toast(erroMsg(o.error));
    const st=await sb.from('setores').select('*');if(st.data){chefes={};st.data.forEach(x=>chefes[x.nome]=x.chefe||'')}
    const cg=await sb.from('cargos').select('*');if(cg.data&&!cg.error){cargosOk=true;cg.data.forEach(x=>{if(x.nome==='Auxiliar de Inventário')CARGOS['Auxiliar de Inventário']=x.perms||[]})}else cargosOk=false;
  }
  carregou=true;render();
}

  if(!falta.length)return;falta.forEach(p=>pedindo.add(p));
  sb.storage.from(BUCKET).createSignedUrls(falta,3600).then(({data})=>{(data||[]).forEach(d=>{if(d.signedUrl)urls[d.path]={url:d.signedUrl,ate:Date.now()+50*60e3}});

/* ---------- Relatório em Excel (gerado no navegador, com gráficos nativos) ---------- */
const XL=(()=>{
  const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  function zip(files){const enc=new TextEncoder(),parts=[],cen=[];let off=0;
    const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
    for(const [name,txt] of files){const nb=enc.encode(name),data=enc.encode(txt),c=crc32(data);
      const lh=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0)]);
      parts.push(lh,nb,data);
      cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
      off+=lh.length+nb.length+data.length}
    const cs=cen.reduce((a,x)=>a+x.length,0);
    const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cs),...u32(off),...u16(0)]);
    return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
  const x=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
  const col=n=>{let s='';n++;while(n){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26)}return s};
  const ref=(c,r)=>col(c)+(r+1);
  const absr=(sh,c1,r1,c2,r2)=>`'${sh}'!$${col(c1)}$${r1+1}:$${col(c2)}$${r2+1}`;
  return{zip,x,col,ref,absr}})();

function planilhaXL(o){ // o:{rows,cols,merges,grid,freeze,filtro,drawing,tab,cor,cf:[xml],fit}
  const rows=[...o.rows].sort((a,b)=>a.r-b.r);let maxC=0,maxR=0;

      if(v===null||v===undefined||v==='')return`<c r="${rf}" s="${s||0}"/>`;
      if(typeof v==='number'&&isFinite(v))return`<c r="${rf}" s="${s||0}"><v>${v}</v></c>`;
      return`<c r="${rf}" s="${s||0}" t="inlineStr"><is><t xml:space="preserve">${XL.x(v)}</t></is></c>`}).join('');
    return`<row r="${rw.r+1}"${rw.h?` ht="${rw.h}" customHeight="1"`:''}>${cs}</row>`}).join('');
  const pane=o.freeze?`<pane ySplit="${o.freeze}" topLeftCell="A${o.freeze+1}" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A${o.freeze+1}" sqref="A${o.freeze+1}"/>`:'';

<sheetData>${sd}</sheetData>${o.filtro?`<autoFilter ref="${o.filtro}"/>`:''}${o.merges&&o.merges.length?`<mergeCells count="${o.merges.length}">${o.merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`:''}${(o.cf||[]).join('')}

function topN(arr,n){if(arr.length<=n)return arr;const r=arr.slice(0,n-1);r.push(['Outros',arr.slice(n-1).reduce((a,x)=>a+x[1],0)]);return r}
function porMesXL(lista,peso){const m=new Map();lista.forEach(o=>{const d=o.categoria==='Consertos Baiano'&&o.data_ref?String(o.data_ref).slice(0,7):mesKey(o.criado);m.set(d,(m.get(d)||0)+(peso?peso(o):1))});

/* ---------- Consertos Baiano: gráfico semana / mês ---------- */
const dStr=d=>d.toLocaleDateString('sv-SE'),dObj=s=>new Date(s+'T12:00:00'),addDias=(s,n)=>{const d=dObj(s);d.setDate(d.getDate()+n);return dStr(d)};
const segDe=s=>{const d=dObj(s);return addDias(s,-((d.getDay()+6)%7))};
const diaBai=o=>o.data_ref?String(o.data_ref).slice(0,10):dia(o.criado);
const ddmm=s=>s.slice(8,10)+'/'+s.slice(5,7);
const DSEM=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
function periodoBai(){const ref=ui.baiRef||hoje();
  if(ui.baiPer==='mes'){const y=+ref.slice(0,4),m=+ref.slice(5,7),ini=ref.slice(0,8)+'01',fim=dStr(new Date(y,m,0,12));
    const grupos=[];for(let s=segDe(ini);s<=fim;s=addDias(s,7)){const a=s<ini?ini:s,b=addDias(s,6)>fim?fim:addDias(s,6);grupos.push({de:a,ate:b,rot:'Sem '+(grupos.length+1),sub:ddmm(a)+'–'+ddmm(b)})}
    return{de:ini,ate:fim,grupos,titulo:MESES_L[m-1][0].toUpperCase()+MESES_L[m-1].slice(1)+' de '+y,nome:'mês',art:'do'}}
  const ini=segDe(ref),fim=addDias(ini,6);
  return{de:ini,ate:fim,grupos:DSEM.map((d,i)=>{const s=addDias(ini,i);return{de:s,ate:s,rot:d,sub:ddmm(s)}}),titulo:'Semana de '+ddmm(ini)+' a '+ddmm(fim)+'/'+fim.slice(0,4),nome:'semana',art:'da'}}
function dadosBai(){const P=periodoBai(),base=ocs.filter(o=>o.categoria==='Consertos Baiano'&&(!ui.pessoa||o.autor===ui.pessoa));
  const regs=base.filter(o=>{const d=diaBai(o);return d>=P.de&&d<=P.ate});
  P.grupos.forEach(g=>{const r=regs.filter(o=>{const d=diaBai(o);return d>=g.de&&d<=g.ate});g.valor=r.reduce((a,o)=>a+(totalBai(o)||0),0);g.pecas=r.reduce((a,o)=>a+(Number(o.qtd)||1),0)});
  P.regs=regs;P.total=regs.reduce((a,o)=>a+(totalBai(o)||0),0);P.pecas=regs.reduce((a,o)=>a+(Number(o.qtd)||1),0);
  P.cortadas=regs.filter(o=>Number(o.valor_conserto)===0).reduce((a,o)=>a+(Number(o.qtd)||1),0);
  P.melhor=P.grupos.reduce((a,g)=>g.valor>(a?a.valor:0)?g:a,null);return P}
function svgBai(P){const W=640,H=230,pl=8,pr=8,pt=26,pb=44,n=P.grupos.length,cw=(W-pl-pr)/n,bw=Math.min(54,cw*.62),mx=Math.max(1,...P.grupos.map(g=>g.valor)),ch=H-pt-pb,hj=hoje();
  const lin=[0,.5,1].map(f=>{const y=pt+ch-ch*f;return`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/>`}).join('');
  return`<svg class="bsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Valor dos consertos por ${P.nome==='mês'?'semana':'dia'}">${lin}${P.grupos.map((g,i)=>{const x=pl+cw*i+(cw-bw)/2,h=g.valor?Math.max(3,ch*g.valor/mx):2,y=pt+ch-h,eh=hj>=g.de&&hj<=g.ate;
    return`<g><title>${g.rot} ${g.sub}: ${brl(g.valor)} · ${g.pecas} peça${g.pecas===1?'':'s'}</title><rect class="bar${g.valor?'':' zero'}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="5"/>
    ${g.valor?`<text class="vl" x="${x+bw/2}" y="${y-7}" text-anchor="middle">${brl(g.valor).replace(/\s/g,' ')}</text>`:''}
    <text class="${eh?'hj':''}" x="${x+bw/2}" y="${H-pb+18}" text-anchor="middle">${g.rot}</text><text x="${x+bw/2}" y="${H-pb+33}" text-anchor="middle" style="font-weight:500">${g.sub}</text></g>`}).join('')}</svg>`}

  document.querySelectorAll('[data-exsim]').forEach(b=>b.addEventListener('click',async()=>{b.disabled=true;const id=b.dataset.exsim;
    const {error}=await sb.rpc('excluir_usuario',{alvo:id});ui.confExcl=null;
    if(error){toast(/excluir_usuario|function|schema cache/i.test(error.message)&&!/administrador|liberados|si mesmo/.test(error.message)?'O banco precisa de uma atualização para excluir usuários. Rode o comando novo no SQL Editor.':erroMsg(error));render();return}
    delete perfis[id];toast('Usuário excluído');render()}));
  document.querySelectorAll('[data-rec]').forEach(b=>b.addEventListener('click',()=>{b.disabled=true;mudaPerfil(b.dataset.rec,{recusado:false},'Cadastro voltou para aguardando')}));
}

/* ---------- Configuração inicial ---------- */
function atobSeguro(k){try{return atob(k.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))}catch(e){return''}}
function telaConfig(){document.body.classList.add('auth');
  $('view').innerHTML=`<div class="stack">
  <div class="box stack"><div><h2>Configuração inicial</h2><p class="muted small" style="margin:0">Feita uma única vez pelo administrador. Leva uns 10 minutos.</p></div>
  <ol class="steps">
   <li>Crie uma conta gratuita em <b>supabase.com</b> e clique em <b>New project</b>. Dê o nome <code>inventario-cd</code>, crie uma senha para o banco (guarde-a) e escolha a região <b>South America (São Paulo)</b>.</li>
   <li>Quando o projeto terminar de criar, abra <b>SQL Editor</b> no menu da esquerda, clique em <b>New query</b>, cole o código copiado pelo botão abaixo e clique em <b>Run</b>. Deve aparecer "Success".<div style="margin-top:8px"><button class="btn sm" id="copiarSql">Copiar código do banco</button> <span class="ok small" id="sqlOk" hidden>Copiado</span></div><textarea id="sqlBox" readonly hidden style="margin-top:8px;min-height:140px;font-family:var(--mono);font-size:.75rem"></textarea></li>
   <li>Em <b>Authentication</b> → <b>Sign In / Providers</b> → <b>Email</b>, desligue <b>Confirm email</b> e salve. Assim a equipe entra logo após o cadastro, sem precisar abrir o e-mail. Se preferir manter a confirmação, cada pessoa recebe um e-mail ao se cadastrar.</li>
   <li>Em <b>Project Settings</b> → <b>API Keys</b>, copie a chave <b>anon public</b> (aba Legacy) ou a <b>Publishable key</b>. Em <b>Project Settings</b> → <b>Data API</b>, copie a <b>Project URL</b>. Cole as duas abaixo.</li>
  </ol></div>
  <form class="box stack" id="fcfg" novalidate>
   <div class="field"><label class="lbl" for="cfgUrl">Project URL</label><input id="cfgUrl" class="mono" placeholder="https://xxxx.supabase.co"></div>
   <div class="field"><label class="lbl" for="cfgKey">Chave anon public / Publishable key</label><input id="cfgKey" class="mono" placeholder="eyJ... ou sb_publishable_..."></div>
   <div id="cfgMsg" hidden></div>
   <button class="btn primary" type="submit">Testar conexão</button>
   <button class="btn" type="button" id="baixar" disabled>Baixar arquivo configurado</button>
   <button class="btn" type="button" id="baixarCfg" disabled>Baixar config.js (para site no GitHub)</button>
   <p class="muted small" style="margin:0">O arquivo baixado já vem com a conexão pronta. Use esse arquivo daqui em diante e copie-o para os outros computadores. <b>A primeira pessoa que se cadastrar vira administrador</b>, então faça o seu cadastro primeiro.</p>
  </form></div>`;
  $('copiarSql').onclick=()=>{const t=$('sql').textContent.trim();const box=$('sqlBox');
    const fb=()=>{box.value=t;box.hidden=false;box.select();toast('Selecione o texto e copie com Ctrl+C')};
    try{navigator.clipboard.writeText(t).then(()=>{$('sqlOk').hidden=false},fb)}catch(e){fb()}};
  let cfg=null;
  if(window.top!==window){$('view').insertAdjacentHTML('afterbegin','<div class="box err" style="margin-bottom:14px">Este arquivo está aberto dentro de outro aplicativo, e assim a conexão não funciona. Baixe o arquivo inventario-cd.html, abra a pasta Downloads e dê dois cliques nele para abrir no Chrome ou no Edge.</div>')}
  $('fcfg').addEventListener('submit',async e=>{e.preventDefault();const m=$('cfgMsg'),btn=e.target.querySelector('[type=submit]');
    let url=$('cfgUrl').value.trim().replace(/\s/g,''),key=$('cfgKey').value.trim().replace(/\s/g,'');
    const ref=url.match(/project\/([a-z0-9]{10,})/i);if(ref)url='https://'+ref[1]+'.supabase.co';
    if(url&&!/^https?:\/\//.test(url))url='https://'+url;
    url=url.replace(/\/(rest|auth)\/v1.*$/,'').replace(/\/+$/,'');$('cfgUrl').value=url;$('cfgKey').value=key;
    const show=(ok,t)=>{m.className=ok?'ok':'err';m.textContent=t;m.hidden=false;m.scrollIntoView({block:'center',behavior:'smooth'})};
    if(!/^https:\/\/[^/]+\.[a-z]+/.test(url)){show(false,'A Project URL parece errada. Ela tem o formato https://xxxx.supabase.co e fica em Project Settings → Data API.');return}
    if(key.length<20){show(false,'A chave parece incompleta. Copie a chave inteira (anon public, que começa com eyJ, ou a Publishable key, que começa com sb_publishable_).');return}
    if(/^sb_secret_/.test(key)||/service_role/.test(atobSeguro(key))){show(false,'Essa é a chave secreta (service_role / secret). Use a chave anon public ou a Publishable key.');return}
    show(true,'Testando…');btn.disabled=true;
    const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),15000);
    try{const h={apikey:key};if(/^eyJ/.test(key))h.Authorization='Bearer '+key;
      const r=await fetch(url+'/rest/v1/ocorrencias?select=id&limit=1',{headers:h,signal:ctl.signal});
      let corpo='';try{corpo=await r.text()}catch(x){}
      if(r.ok){cfg={url,key};$('baixar').disabled=false;$('baixarCfg').disabled=false;
        show(true,window.supabase?'Conexão funcionando. Agora clique em Baixar arquivo configurado.':'O banco respondeu, mas este computador não carregou um componente do app (cdn.jsdelivr.net). Baixe o arquivo configurado e teste; se não abrir, a rede da empresa pode estar bloqueando esse endereço.')}
      else if(r.status===401||r.status===403||/Invalid API key|No API key/i.test(corpo))show(false,'O servidor recusou a chave (erro '+r.status+'). Copie de novo a chave anon public ou a Publishable key, inteira.');
      else if(r.status===404||/PGRST205|42P01|does not exist|schema cache/i.test(corpo))show(false,'Conectou, mas o banco não está pronto. Refaça o passo 2: cole o código do banco no SQL Editor e clique em Run.');
      else show(false,'O servidor respondeu com erro '+r.status+'. '+corpo.slice(0,160))}
    catch(x){show(false,x.name==='AbortError'?'O servidor não respondeu em 15 segundos. Confira a Project URL. Se estiver certa, a rede da empresa pode estar bloqueando o endereço supabase.co.':'Não foi possível chegar ao servidor. Confira a Project URL. Se estiver certa, a rede da empresa pode estar bloqueando o endereço supabase.co (teste em outra rede, como o 4G do celular).')}
    clearTimeout(timer);btn.disabled=false});
  const baixa=(nomeArq,txt,tipo)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nomeArq;document.body.appendChild(a);a.click();a.remove()};
  $('baixarCfg').onclick=()=>{if(!cfg)return;baixa('config.js','window.INV_CONFIG='+JSON.stringify(cfg)+';\n','text/javascript');toast('config.js baixado. Envie para o repositório junto com o index.html.')};
  $('baixar').onclick=()=>{if(!cfg)return;
    const html=ORIGINAL.replace("const SUPABASE_URL='';const SUPABASE_KEY='';",`const SUPABASE_URL=${JSON.stringify(cfg.url)};const SUPABASE_KEY=${JSON.stringify(cfg.key)};`);
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='inventario-cd.html';document.body.appendChild(a);a.click();a.remove();
    toast('Arquivo baixado. Abra o inventario-cd.html da pasta Downloads.')};
}

init();
</script>
